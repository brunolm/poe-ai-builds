<head>
  <meta charset="utf-8">

  <title>PoE2 0.5 Shield Wall Titan / Smith League Starter Guide</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101318;
      --panel: #171b22;
      --panel-2: #202631;
      --text: #e8edf2;

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        linear-gradient(180deg, rgba(225, 181, 100, 0.07), transparent 420px),
        var(--bg);
      color: var(--text);
      font: 16px/1.55 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

    header {

    }

    .wrap {

      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 14px 0;
    }

    .brand {
      display: grid;
      gap: 2px;
    }

    .brand strong {
      color: var(--accent);

      letter-spacing: 0;

    }

    .brand span {
      color: var(--muted);
      font-size: 13px;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    nav a {
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      padding: 6px 9px;
      text-decoration: none;
    }

    nav a:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    main {
      padding: 34px 0 70px;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(280px, 0.75fr);
      gap: 22px;
      align-items: start;
      margin-bottom: 24px;
    }

    h1,
    h2,
    h3 {
      line-height: 1.15;
      letter-spacing: 0;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(32px, 5vw, 58px);
    }

    h2 {
      margin: 0 0 14px;
      color: var(--accent);
      font-size: 28px;
    }

    h3 {
      margin: 0 0 10px;
      color: var(--accent-2);
      font-size: 20px;
    }

    p {
      margin: 0 0 14px;
    }

    .lede {
      color: var(--muted);
      font-size: 19px;
      max-width: 76ch;
    }

    .card,
    .section,
    .level-card,
    .callout {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(23, 27, 34, 0.92);
    }

    .card {
      padding: 18px;
    }

    .section {
      padding: 24px;
      margin-top: 18px;
    }

    .grid {
      display: grid;
      gap: 14px;
    }

    .grid.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .grid.three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .stat-list {
      display: grid;
      gap: 9px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .stat-list li {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);

    .stat-list b {
      color: var(--text);
      font-weight: 650;
    }

    .stat-list span {
      color: var(--muted);
      text-align: right;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 18px 0 0;
    }

    .tag {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel-2);
      color: var(--muted);
      font-size: 13px;
      padding: 5px 9px;
    }

    .good {
      color: var(--good);
    }

    .warn {
      color: var(--warn);
    }

    .danger {
      color: var(--danger);
    }

    ul,
    ol {
      margin: 0 0 14px 20px;
      padding: 0;
    }

    li + li {
      margin-top: 6px;
    }

    .level-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .level-grid.level-tabs {
      grid-template-columns: 1fr;
    }

    .level-tab-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .level-tab {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel-2);
      color: var(--text);
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      min-width: 74px;
      padding: 8px 11px;
    }

    .level-tab:hover,
    .level-tab:focus-visible {
      border-color: var(--accent);
      color: var(--accent);
      outline: none;
    }

    .level-tab.active,
    .level-tab[aria-selected="true"] {
      border-color: var(--accent);
      background: rgba(225, 181, 100, 0.14);
      color: var(--accent);
      font-weight: 650;
    }

    .level-panels {
      display: grid;
      gap: 16px;
    }

    .level-card {
      overflow: hidden;
    }

    .level-card header {
      position: static;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: var(--panel-2);
      padding: 13px 16px;
    }

    .level-card header strong {
      display: block;
      color: var(--accent);
      font-size: 18px;
    }

    .level-card header span {
      color: var(--muted);
      font-size: 13px;
    }

    .level-card .body {
      padding: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0 18px;
      overflow: hidden;
      border-radius: 8px;
    }

    th,
    td {
      border: 1px solid var(--line);
      padding: 10px 11px;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: var(--panel-2);
      color: var(--accent);
      font-weight: 650;
    }

    td {
      background: rgba(255, 255, 255, 0.018);
    }

    .gear-table td:first-child {
      width: 120px;
      color: var(--muted);
      font-weight: 650;
    }

    .gear-table tbody tr:hover td {
      background: rgba(225, 181, 100, 0.05);
    }

    .item-hover {
      position: relative;
      display: inline-flex;
      max-width: 100%;
      border-bottom: 1px dotted rgba(246, 213, 139, 0.62);
      color: #f6d58b;
      cursor: help;
      font-weight: 650;
      outline: none;
    }

    .item-hover:focus-visible {
      border-radius: 4px;
      outline: 2px solid var(--accent-2);
      outline-offset: 3px;
    }

    .item-hover:hover,
    .item-hover:focus {
      z-index: 4;
    }

    .item-card {
      position: absolute;
      top: calc(100% + 9px);
      left: 50%;
      z-index: 5;
      display: grid;
      width: min(360px, calc(100vw - 48px));
      gap: 5px;
      border: 1px solid rgba(225, 181, 100, 0.52);
      border-radius: 6px;
      background: #0b0e12;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.48);
      color: var(--text);
      font-weight: 400;
      opacity: 0;
      padding: 12px;
      pointer-events: none;
      transform: translate(-50%, -4px);
      transition: opacity 140ms ease, transform 140ms ease, visibility 140ms ease;
      visibility: hidden;

    .item-hover:hover .item-card,
    .item-hover:focus .item-card {
      opacity: 1;
      transform: translate(-50%, 0);
      visibility: visible;
    }

    .item-title {
      color: var(--accent);
      font-weight: 750;
    }

    .item-line {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .item-line b {

      font-weight: 650;
    }

    code {
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 5px;
      background: #0b0e12;
      color: #f6d58b;
      padding: 1px 5px;

    .callout {
      border-left: 4px solid var(--accent);

      margin: 16px 0;
    }

    .callout.danger {
      border-left-color: var(--danger);
      color: var(--text);
    }

    .callout.good {
      border-left-color: var(--good);
      color: var(--text);
    }

    .small {
      color: var(--muted);

    }

    .sources {

      gap: 8px;
      margin: 0;
      padding: 0;

    }

    .sources li {
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);

    @media (max-width: 920px) {
      .hero,

        align-items: flex-start;
        flex-direction: column;
      }

      nav {
        justify-content: flex-start;
      }
    }
  </style>

<body>
  <header>
    <div class="wrap topbar">
      <div class="brand">
        <strong>PoE2 0.5 League Starter</strong>
        <span>Shield Wall Titan / Smith of Kitava - Hardcore and SSF focused</span>
      </div>
      <nav aria-label="Guide navigation">
        <a href="#overview">Overview</a>
        <a href="#leveling">Leveling</a>
        <a href="#gear">Gear</a>
        <a href="#item-crafting">Item Crafting</a>
        <a href="#ascendancy">Ascendancy</a>
        <a href="#mapping">Mapping</a>
        <a href="#sources">Sources</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="hero" id="overview">
      <div>
        <h1>Shield Wall Warrior League Starter</h1>
        <p class="lede">
          A cheap, durable 0.5 starter built around <strong>Shield Wall</strong>,
          <strong>Fortifying Cry</strong>, <strong>Infernal Cry</strong>, and
          <strong>Resonating Shield</strong>. The default recommendation is
          <strong>Titan</strong> for Hardcore. <strong>Smith of Kitava</strong>
          is the alternate version when you want simpler resistance gearing and
          a stronger body-armour defensive package.
        </p>
        <div class="tag-row">
          <span class="tag">Hardcore viable</span>
          <span class="tag">SSF viable</span>
          <span class="tag">Low unique dependence</span>
          <span class="tag">Shield armour scales damage</span>
          <span class="tag">Patch 0.5 pre-launch plan</span>
        </div>
      </div>
      <aside class="card">
        <h3>Build Snapshot</h3>
        <ul class="stat-list">
          <li><b>Best default</b><span>Titan Shield Wall</span></li>
          <li><b>Safer tradeoff</b><span>Slower clear, high defence</span></li>
          <li><b>Main scaler</b><span>Armour on shield</span></li>
          <li><b>Weapon priority</b><span>Gem levels, speed, stats</span></li>
          <li><b>Primary risk</b><span>Cooldown rhythm and boss uptime</span></li>
          <li><b>First major swap</b><span>1H mace + Armoured Shield</span></li>
        </ul>
      </aside>
    </section>

    <section class="section">
      <h2>Why This Works In 0.5</h2>
      <div class="grid two">
        <div>
          <h3>Defensive Upside</h3>
          <ul>
            <li>0.5 adds <strong>Runic Ward</strong>, a defensive buffer that starts protecting you after you reach 1 life. Low-level armour can gain it without trading away base defences.</li>
            <li>Armour from items and modifiers is increased at higher levels. The official notes give about 33% more armour at level 65, tapering to 15% at level 80+.</li>
            <li>Warrior naturally stacks life, armour, strength, shields, and guard uptime. That is the profile you want for early Hardcore.</li>
          </ul>
        </div>
        <div>
          <h3>Damage Reality Check</h3>
          <ul>
            <li>Shield Wall and Fortifying Cry were nerfed from 6-8 to 5-7 added physical damage per 15 shield armour. The build is weaker than old wall overlap versions.</li>
            <li>Fortifying Cry shockwaves from one Shield Wall can no longer hit the same enemy multiple times. Do not expect old shotgun boss damage.</li>
            <li>The build still has a strong campaign and early-map floor because shield upgrades are common and the core gear is rare-item friendly.</li>
          </ul>
        </div>
      </div>
      <div class="callout">
        <strong>Rule of thumb:</strong> once Shield Wall is online, your shield is your real weapon. A 900-armour shield with a mediocre mace is usually better than a strong weapon with a weak shield.
      </div>
    </section>

    <section class="section" id="leveling">
      <h2>Level-by-Level Setup</h2>
      <p class="small">
        Character levels are approximate. In PoE2 the exact unlock depends on campaign rewards and Uncut Gem tier drops. If you find a higher-tier Uncut Skill Gem early, upgrade the main skill listed for your current bracket.
      </p>

      <div class="level-grid level-tabs" data-level-tabs>
        <div class="level-tab-list" role="tablist" aria-label="Level ranges">
          <button class="level-tab active" type="button" id="tab-levels-1-12" role="tab" aria-selected="true" aria-controls="levels-1-12" data-level-tab>1-12</button>
          <button class="level-tab" type="button" id="tab-levels-13-22" role="tab" aria-selected="false" aria-controls="levels-13-22" data-level-tab>13-22</button>
          <button class="level-tab" type="button" id="tab-levels-23-31" role="tab" aria-selected="false" aria-controls="levels-23-31" data-level-tab>23-31</button>
          <button class="level-tab" type="button" id="tab-levels-32-44" role="tab" aria-selected="false" aria-controls="levels-32-44" data-level-tab>32-44</button>
          <button class="level-tab" type="button" id="tab-levels-45-60" role="tab" aria-selected="false" aria-controls="levels-45-60" data-level-tab>45-60</button>
          <button class="level-tab" type="button" id="tab-levels-61-75" role="tab" aria-selected="false" aria-controls="levels-61-75" data-level-tab>61-75</button>
          <button class="level-tab" type="button" id="tab-levels-endgame" role="tab" aria-selected="false" aria-controls="levels-endgame" data-level-tab>Endgame</button>
        </div>

        <div class="level-panels">
        <article class="level-card level-panel" id="levels-1-12" role="tabpanel" aria-labelledby="tab-levels-1-12" data-level-panel>
          <header>
            <strong>Level 1-12</strong>
            <span>Act 1 opening - pre Shield Wall</span>
          </header>
          <div class="body">
            <h3>Gear Table</h3>
            <table class="gear-table">
              <thead>
                <tr>
                  <th>Slot</th>
                  <th>Target</th>
                  <th>Keep / Replace Rule</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>Weapon</td>
                  <td>
                    <span class="item-hover" tabindex="0">Best 2H mace
                      <span class="item-card" role="tooltip">
                        <span class="item-title">Best 2H mace</span>
                        <span class="item-line">Base: any two-handed mace with the highest visible physical damage.</span>
                        <span class="item-line">Mods: added physical damage, increased physical damage, attack speed, strength.</span>
                        <span class="item-line">Craft: Transmute/Augment only; replace often instead of polishing a low base.</span>
                      </span>
                    </span>
                  </td>
                  <td>Replace whenever a new mace gives clearly higher hit damage.</td>
                </tr>
                <tr>
                  <td>Shield</td>
                  <td>
                    <span class="item-hover" tabindex="0">Saved armoured shield
                      <span class="item-card" role="tooltip">
                        <span class="item-title">Saved armoured shield</span>
                        <span class="item-line">Base: pure armour shield, preferably an Armoured Shield line base.</span>
                        <span class="item-line">Mods: local armour, quality, life, block, resistances.</span>
                        <span class="item-line">Use: stash the best one for the level 23 Shield Wall swap.</span>
                      </span>
                    </span>
                  </td>
                  <td>Do not force shield play yet unless the shield setup feels better than 2H.</td>
                </tr>
                <tr>
                  <td>Armour</td>
                  <td>
                    <span class="item-hover" tabindex="0">Life/res armour rares
                      <span class="item-card" role="tooltip">
                        <span class="item-title">Life/res armour rares</span>
                        <span class="item-line">Base: pure armour helmet, body, gloves, and boots when possible.</span>
                        <span class="item-line">Mods: life first, then elemental resistance and armour.</span>
                        <span class="item-line">Craft: use cheap currency only when a piece fixes multiple early problems.</span>
                      </span>
                    </span>
                  </td>
                  <td>Wear any base if it prevents a resistance hole before an act boss.</td>
                </tr>
                <tr>
                  <td>Boots</td>
                  <td>
                    <span class="item-hover" tabindex="0">Movement boots
                      <span class="item-card" role="tooltip">
                        <span class="item-title">Movement boots</span>
                        <span class="item-line">Base: any boots early; armour boots are preferred when stats are close.</span>
                        <span class="item-line">Mods: movement speed, life, resistance.</span>
                        <span class="item-line">HC note: speed prevents avoidable boss and rare hits.</span>
                      </span>
                    </span>
                  </td>
                  <td>Prefer faster boots unless slower boots are needed to cap a lethal resistance.</td>
                </tr>
                <tr>
                  <td>Jewelry</td>
                  <td>
                    <span class="item-hover" tabindex="0">Resist or damage rings
                      <span class="item-card" role="tooltip">
                        <span class="item-title">Resist or damage rings</span>
                        <span class="item-line">Base: resistance or attribute rings from drops/vendors.</span>
                        <span class="item-line">Mods: elemental resistance, life, strength, early flat physical damage.</span>
                        <span class="item-line">Use: swap rings per boss element instead of chasing perfect rolls.</span>
                      </span>
                    </span>
                  </td>
                  <td>Use flat physical early; later these become resistance and attribute slots.</td>
                </tr>

    <section class="section" id="item-crafting">

      <p>
        The craft plan is simple: upgrade the base first, then spend currency. For this build, the shield is both a weapon
        and a defensive slot, so shield armour beats nearly every other item upgrade until mapping feels stable.
      </p>

      <div class="callout good">
        <strong>Hardcore rule:</strong> craft defenses before damage unless a campaign boss is specifically blocking progress.
        Capped resistances, a current shield, movement speed, and updated flasks are worth more than a bigger tooltip.
      </div>

                <td><code>Tawhoan Tower Shield</code>, with <code>Vaal Tower Shield</code> as fallback</td>

            <li><strong>Life:</strong> take it on every rare slot that can reasonably roll it.</li>
            <li><strong>Armour:</strong> this is the main mitigation layer. Prefer pure armour bases on shield and armour slots.</li>
            <li><strong>Block:</strong> valuable on shield because you are already committed to a shield setup.</li>
            <li><strong>Resistances:</strong> cap elemental resistances before chasing damage; build toward positive chaos resistance for maps.</li>
            <li><strong>Runic Ward:</strong> use it as an extra 0.5 defensive layer on armour pieces, especially while gearing cheaply.</li>
            <li><strong>Ailment coverage:</strong> solve bleed, freeze, shock, poison, ignite, and stun through charms, suffixes, and runes.</li>
          </ol>
          <p>
            Do not build around energy shield or evasion for this version. ES and evasion gear can be worn briefly if it fixes a lethal
            resistance gap, but the planned endgame setup is life plus armour, shield armour scaling, block, capped resistances, chaos

      <h3>Currency Discipline</h3>
      <div class="grid two">
        <div class="card">
          <h3>Campaign Crafting Rules</h3>
          <ol>
            <li>Do not hoard so hard that your gear falls behind. Use Transmutation, Augmentation, Regal, and relevant Essences on shield, boots, flasks, and resistance slots.</li>
            <li>Prioritize shield armour because Shield Wall and Fortifying Cry scale from the equipped shield's armour value.</li>
            <li>Replace low item-level bases before investing more currency. A weak rare shield is still weak if the base armour is outdated.</li>
            <li>Use Essences when the guaranteed stat solves a real problem: resistance cap, life, armour, movement speed, or attributes.</li>
            <li>Use Runic Ward on armour pieces while leveling. In 0.5, low-level armour can gain Runic Ward without losing its base defense.</li>
          </ol>
        </div>
        <div class="card">
          <h3>When To Spend More</h3>
          <ol>
            <li>Spend on a new shield whenever the armour jump is large, even if the old shield has better suffixes.</li>
            <li>Spend on boots when you lack movement speed; bad movement gets characters killed in campaign and early maps.</li>
            <li>Spend on rings, belt, and amulet when elemental resistances or attributes are blocking gear and gem upgrades.</li>
            <li>Save expensive crafts for items that can last several acts or multiple map tiers.</li>
            <li>Do not overwrite useful runes on gear that is about to be replaced.</li>
          </ol>
        </div>
      </div>

      <h3>Concrete Endgame Craft Recipes</h3>
      <p class="small">
        These recipes are for the endgame target items in the Endgame tab. They use current 0.5 crafting rules: rare items cap at
        3 prefixes and 3 suffixes, Greater Essences upgrade magic items to rares, Perfect/Corrupted Essences replace a modifier,
        side omens force prefix or suffix operations, and Abyss omens let you add, reveal, reroll, or remove desecrated modifiers.
      </p>
      <div class="callout warn">
        <strong>Current-patch note:</strong> do not budget around <code>Omen of Homogenising Exaltation</code> or
        <code>Omen of Homogenising Coronation</code>. The wiki marks them drop-disabled since 0.4; existing legacy copies still work,
        but this guide assumes a fresh league start.
      </div>

      <h3>Technique Rules Used</h3>
      <table>
        <thead>
          <tr>
            <th>Technique</th>
            <th>Exact Use</th>
            <th>When To Use It</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Prefix/suffix blocking</td>
            <td>Fill one side of the item. If all 3 prefixes are full, the next Exalted Orb can only add a suffix; if all 3 suffixes are full, it can only add a prefix.</td>
            <td>Preferred over spending a side omen when the item is already naturally blocked.</td>
          </tr>
          <tr>
            <td><code>Omen of Sinistral Exaltation</code> / <code>Omen of Dextral Exaltation</code></td>
            <td>Sinistral makes the next Exalted Orb add only a prefix. Dextral makes it add only a suffix.</td>
            <td>Use when the side you want is not already blocked by full prefixes or suffixes.</td>
          </tr>
          <tr>
            <td><code>Omen of Greater Exaltation</code></td>
            <td>The next Exalted Orb adds two modifiers. With a side omen or a full opposite side, both additions are pushed onto the open side if space exists.</td>
            <td>Use only on items where both open slots on that side would be useful.</td>
          </tr>
          <tr>
            <td><code>Perfect Exalted Orb</code></td>
            <td>Adds a random modifier with minimum modifier level 50. With <code>Omen of Greater Exaltation</code>, both added modifiers use the Perfect Exalt tier floor.</td>
            <td>Use for the final one or two mods on a base that is already worth saving.</td>
          </tr>
          <tr>
            <td>Perfect/Corrupted Essence side control</td>
            <td><code>Omen of Sinistral Crystallisation</code> makes the essence remove only prefixes. <code>Omen of Dextral Crystallisation</code> makes it remove only suffixes.</td>
            <td>Use when the guaranteed essence mod is worth replacing a controlled bad mod on the same side.</td>
          </tr>
          <tr>
            <td>Chaos rescue</td>
            <td><code>Omen of Sinistral Erasure</code> makes Chaos remove a prefix; <code>Omen of Dextral Erasure</code> makes Chaos remove a suffix; <code>Omen of Whittling</code> targets the lowest item-level mod.</td>
            <td>Use as a rescue on a 4-5 good-mod item, not as a cheap early craft.</td>
          </tr>
          <tr>
            <td>Fracturing</td>
            <td>Use <code>Fracturing Orb</code> only on a rare with at least 4 modifiers. A desecrated mod counts toward the 4-mod requirement but cannot be fractured.</td>
            <td>Use on a near-perfect project when locking one premium mod is worth the cost.</td>
          </tr>
          <tr>
            <td>Abyss desecration loop</td>
            <td>Use <code>Omen of Dextral Necromancy</code> for a suffix or <code>Omen of Sinistral Necromancy</code> for a prefix, reveal with <code>Omen of Abyssal Echoes</code>, then remove bad revealed mods with <code>Omen of Light</code> + <code>Orb of Annulment</code>.</td>
            <td>Use after the normal affixes are already strong and you are fishing for the last premium defensive mod.</td>
          </tr>
        </tbody>
      </table>

          <article class="card level-panel" id="craft-shield" role="tabpanel" aria-labelledby="tab-craft-shield" data-level-panel>
            <h3>Tawhoan Tower Shield</h3>
            <p class="small">Target: 1,470+ armour good, 1,525+ ideal, then life, block, elemental resistance, chaos resistance, and strength. This is the build's damage item.</p>
            <ol>
              <li>Buy or farm an item-level 80+ normal <code>Tawhoan Tower Shield</code>. Use <code>Vaal Tower Shield</code> only if Tawhoan is too expensive.</li>
              <li>Quality first with <code>Armourer's Scrap</code>. Do not spend high currency before quality because quality scales the local armour base.</li>
              <li>Budget craft: use <code>Orb of Transmutation</code> or <code>Greater/Perfect Orb of Transmutation</code> until you hit high flat armour or high % armour. If the first mod is not an armour prefix, restart.</li>
              <li>Use <code>Orb of Augmentation</code> or <code>Greater/Perfect Orb of Augmentation</code>. Keep only a second armour prefix, life, block, resistance, chaos resistance, or strength.</li>
              <li>If the item has one armour prefix and one good suffix, use <code>Greater Essence of Enhancement</code> to upgrade to rare with another armour/defence prefix.</li>
              <li>If prefixes are not full, use <code>Omen of Sinistral Exaltation</code> + <code>Perfect Exalted Orb</code> to attempt the third prefix. Keep life, hybrid armour/life, flat armour, or % armour. If it hits a bad prefix, use <code>Omen of Sinistral Annulment</code> + <code>Orb of Annulment</code>; restart if a key armour prefix is removed.</li>
              <li>Once prefixes are full, the item is prefix-blocked. Use <code>Perfect Exalted Orb</code> for suffixes, or <code>Omen of Greater Exaltation</code> + <code>Perfect Exalted Orb</code> if two suffixes are open and every useful suffix helps.</li>
              <li>Near-perfect route: buy a fractured T1/T2 armour prefix shield. If it is magic with only the fractured prefix, start at step 4. If it is rare, clean only bad suffixes with <code>Omen of Dextral Erasure</code> + <code>Chaos Orb</code> or <code>Omen of Dextral Annulment</code> + <code>Orb of Annulment</code>, then use Sinistral prefix slams for missing armour/life prefixes.</li>
              <li>Final only: add <code>Artificer's Orb</code>, socket the defensive rune that fixes the last cap, then Runeforge for Runic Ward if the armour loss is acceptable.</li>
            </ol>
          </article>

          <article class="card level-panel" id="craft-weapon" role="tabpanel" aria-labelledby="tab-craft-weapon" data-level-panel hidden>
            <h3>Fortified Hammer / Structured Hammer</h3>
            <p class="small">Target: +4 attack skills from <code>Perfect Essence of Battle</code>, attack speed or Onslaught utility, strength, resistance, and mana help. Physical DPS is secondary after Shield Wall.</p>
            <ol>
              <li>Start with an item-level 80+ normal one-hand mace. Quality with <code>Blacksmith's Whetstone</code> only if you still use the mace for hit damage.</li>
              <li>Use <code>Perfect Orb of Transmutation</code> until the first mod is attack speed, a useful resistance, strength, or another mod you are willing to keep.</li>
              <li>Use <code>Perfect Orb of Augmentation</code>. If you hit a good suffix, keep it; if the suffix is bad and the prefix is good, use <code>Omen of Dextral Annulment</code> + <code>Orb of Annulment</code>. Restart if the good mod is removed.</li>
              <li>Use <code>Greater Essence of Haste</code> for attack speed or <code>Greater Essence of the Infinite</code> for attributes if you still need the guaranteed stat. Otherwise use <code>Regal Orb</code> only when both magic mods are good.</li>
              <li>For the near-perfect +skills step, make sure the rare has a replaceable suffix. Activate <code>Omen of Dextral Crystallisation</code>, then use <code>Perfect Essence of Battle</code>. This replaces only a suffix and adds +4 to attack skills on one-hand weapons.</li>
              <li>If prefixes are full, suffixes are the only place an Exalted Orb can go. Use <code>Perfect Exalted Orb</code> for attack speed, strength, resistance, or mana utility. If prefixes are not full, activate <code>Omen of Dextral Exaltation</code> first.</li>
              <li>If a suffix bricks the item, use <code>Omen of Dextral Erasure</code> + <code>Chaos Orb</code> for a suffix-only reroll. Stop if the weapon already solves +skills plus two useful suffixes.</li>
              <li>Add one socket and a resistance, strength, or mana rune last.</li>
            </ol>
          </article>

          <article class="card level-panel" id="craft-body-titan" role="tabpanel" aria-labelledby="tab-craft-body-titan" data-level-panel hidden>
            <h3>Rare Warlord Cuirass - Titan</h3>
            <p class="small">Target: 2,100+ armour good, 2,900+ aspirational, high life, elemental resistances, chaos resistance, and optional phys taken as chaos when chaos resistance is positive.</p>
            <ol>
              <li>Start with item-level 80+ normal <code>Warlord Cuirass</code>. Quality with <code>Armourer's Scrap</code> before crafting.</li>
              <li>Use <code>Perfect Orb of Transmutation</code> until you hit high flat armour, high % armour, or high life. Restart if the first mod is weak.</li>
              <li>Use <code>Perfect Orb of Augmentation</code>. Keep another premium prefix or a strong suffix: elemental resistance, chaos resistance, strength, or reduced requirements.</li>
              <li>If you have one armour prefix and one good suffix, use <code>Greater Essence of Enhancement</code> to add a second armour prefix. If you have armour but no life, use <code>Greater Essence of the Body</code>.</li>
              <li>For the premium third prefix, use <code>Omen of Sinistral Exaltation</code> + <code>Perfect Exalted Orb</code>. Keep only life, armour, or hybrid defensive prefixes. Annul bad prefixes with <code>Omen of Sinistral Annulment</code>; restart if the armour base is ruined.</li>
              <li>If prefixes are full, add suffixes with <code>Perfect Exalted Orb</code> or <code>Omen of Greater Exaltation</code> + <code>Perfect Exalted Orb</code>. Prefix blocking makes those Exalts land suffixes.</li>
              <li>Optional high-end swap: if one prefix is bad, activate <code>Omen of Sinistral Crystallisation</code> and use <code>Perfect Essence of the Body</code> for % maximum life, or <code>Perfect Essence of Ruin</code> for phys taken as chaos. Only do this with positive chaos resistance and a replaceable prefix.</li>
              <li>Optional Abyss finish: use <code>Omen of Dextral Necromancy</code> + <code>Preserved Rib</code>, reveal with <code>Omen of Abyssal Echoes</code>, and keep a T1/T2 resistance or defensive suffix. If bad, use <code>Omen of Light</code> + <code>Orb of Annulment</code> and repeat.</li>
              <li>Socket, rune, and Runeforge only after the item passes the armour/life/resistance target.</li>
            </ol>
          </article>

          <article class="card level-panel" id="craft-body-smith" role="tabpanel" aria-labelledby="tab-craft-body-smith" data-level-panel hidden>
            <h3>Normal Warlord Cuirass - Smith</h3>
            <p class="small">Target: the highest normal pure-armour body you can equip for <code>Smith's Masterwork</code>.</p>
            <ol>
              <li>Buy or farm a normal <code>Warlord Cuirass</code> or equivalent highest-armour pure armour body.</li>
              <li>Use <code>Armourer's Scrap</code> for quality.</li>
              <li>Do not use <code>Orb of Transmutation</code>, Essence, <code>Orb of Alchemy</code>, <code>Regal Orb</code>, <code>Exalted Orb</code>, Chaos, Fracturing, or Desecration. Any rarity change breaks the normal-body plan.</li>
              <li>Only add sockets, runes, or Runic Ward after checking in game that the body still counts for <code>Smith's Masterwork</code>. If it stops counting, remove the body plan and use Titan-style rares instead.</li>
            </ol>
          </article>

          <article class="card level-panel" id="craft-helmet" role="tabpanel" aria-labelledby="tab-craft-helmet" data-level-panel hidden>
            <h3>Imperial / Paragon / Spired Greathelm</h3>
            <p class="small">Target: 900+ armour good, 1,150+ ideal, life, two useful suffixes, and chaos resistance if possible.</p>
            <ol>
              <li>Quality a normal pure-armour helm with <code>Armourer's Scrap</code>.</li>
              <li>Use <code>Greater/Perfect Orb of Transmutation</code> until the first mod is life, armour, elemental resistance, chaos resistance, or strength.</li>
              <li>Use <code>Greater/Perfect Orb of Augmentation</code>. Keep only a second useful defensive mod.</li>
              <li>If life is missing, use <code>Greater Essence of the Body</code>. If armour is missing, use <code>Greater Essence of Enhancement</code>. If both are solved, use <code>Greater Essence of Ruin</code>, <code>Insulation</code>, <code>Thawing</code>, or <code>Grounding</code> for the cap you need.</li>
              <li>Near-perfect route: once two prefixes are good, use <code>Omen of Sinistral Exaltation</code> + <code>Perfect Exalted Orb</code> for the third prefix. Once prefixes are full, use Exalts for suffixes without needing Dextral.</li>
              <li>Use <code>Omen of Dextral Erasure</code> + <code>Chaos Orb</code> only to reroll a bad suffix on a helm with strong prefixes.</li>
              <li>Socket and defensive rune last.</li>
            </ol>
          </article>

          <article class="card level-panel" id="craft-gloves" role="tabpanel" aria-labelledby="tab-craft-gloves" data-level-panel hidden>
            <h3>Massive Mitts / Vaal Mitts / Ornate Mitts</h3>
            <p class="small">Target: 400+ armour good, 530+ ideal, life, armour, resistance suffixes, and optional attack speed only after defenses are solved.</p>
            <ol>
              <li>Quality a normal pure-armour glove base with <code>Armourer's Scrap</code>.</li>
              <li>Use <code>Greater/Perfect Orb of Transmutation</code> for life, armour, resistance, chaos resistance, strength, or attack speed.</li>
              <li>Use <code>Greater/Perfect Orb of Augmentation</code>. Continue only if both magic mods are useful.</li>
              <li>Use <code>Greater Essence of the Body</code> for life, <code>Greater Essence of Enhancement</code> for armour, or a resistance essence to make the item rare with a guaranteed missing stat.</li>
              <li>If prefixes are full, use <code>Perfect Exalted Orb</code> for suffixes. If prefixes are not full and you need a suffix, activate <code>Omen of Dextral Exaltation</code> first.</li>
              <li>Optional high-end: use <code>Omen of Dextral Necromancy</code> + <code>Preserved Rib</code> for a desecrated suffix, reveal with <code>Omen of Abyssal Echoes</code>, remove bad results with <code>Omen of Light</code> + <code>Orb of Annulment</code>.</li>
              <li>Do not use offensive corrupted essences unless the gloves already cap life and resistances.</li>
            </ol>
          </article>

          <article class="card level-panel" id="craft-boots" role="tabpanel" aria-labelledby="tab-craft-boots" data-level-panel hidden>
            <h3>Tasalian / Vaal / Bulwark Greaves</h3>
            <p class="small">Target: 500+ armour good, 560+ ideal, movement speed, life/armour prefixes, and two or three defensive suffixes.</p>
            <ol>
              <li>Start with item-level 80+ pure-armour greaves. Do not continue a no-movement-speed pair unless it is only a temporary resistance swap.</li>
              <li>Budget craft: use <code>Orb of Transmutation</code> until movement speed appears. Use <code>Orb of Augmentation</code>; continue only if the second mod is life, armour, or a resistance.</li>
              <li>Use <code>Greater Essence of Ruin</code>, <code>Insulation</code>, <code>Thawing</code>, or <code>Grounding</code> to add the exact resistance and make the boots rare.</li>
              <li>Near-perfect suffix setup: if movement speed is already present and prefixes are acceptable, fill suffixes with <code>Omen of Dextral Exaltation</code> + <code>Perfect Exalted Orb</code>, or with plain Exalts if all prefixes are full.</li>
              <li>Premium movement rescue: on rare boots with good suffixes and a replaceable prefix, activate <code>Omen of Sinistral Crystallisation</code>, then use <code>Essence of Hysteria</code>. This preserves suffixes by forcing the essence to remove a prefix and adds 30% movement speed.</li>
              <li>If the wrong prefix is removed, stop unless the remaining suffixes are excellent. Use <code>Omen of Sinistral Annulment</code> only when one bad prefix blocks an otherwise finished pair.</li>
              <li>Quality, socket, and rune last.</li>
            </ol>
          </article>

          <article class="card level-panel" id="craft-belt" role="tabpanel" aria-labelledby="tab-craft-belt" data-level-panel hidden>
            <h3>Life / Resistance Belt</h3>
            <p class="small">Target: maximum life, chaos resistance, two elemental resistances or strength, and useful flask/charm utility.</p>
            <ol>
              <li>Pick the belt implicit first. Use a charm/flask utility base only if it solves a real defensive problem.</li>
              <li>Use <code>Greater/Perfect Orb of Transmutation</code> until life, chaos resistance, elemental resistance, strength, or flask/charm utility appears.</li>
              <li>Use <code>Greater/Perfect Orb of Augmentation</code>. Continue only with another cap-fixing mod or life.</li>
              <li>Use <code>Greater Essence of the Body</code> if life is missing. Use <code>Greater Essence of Ruin</code> or the exact elemental resistance essence if suffixes are the problem.</li>
              <li>If prefixes are full, Exalts can only add suffixes. Use <code>Perfect Exalted Orb</code> for a high-tier suffix. If prefixes are not full, use <code>Omen of Dextral Exaltation</code> first.</li>
              <li>Use <code>Omen of Dextral Erasure</code> + <code>Chaos Orb</code> to reroll a bad suffix only if the belt already has life plus two useful mods.</li>
              <li>Stop once the belt fixes life and two defensive holes. Belt perfection is lower priority than shield/body/boots.</li>
            </ol>
          </article>

          <article class="card level-panel" id="craft-rings" role="tabpanel" aria-labelledby="tab-craft-rings" data-level-panel hidden>
            <h3>Resistance Rings</h3>
            <p class="small">Target: resistance implicit, maximum life, chaos resistance, strength/attributes, and two elemental resistance suffixes.</p>
            <ol>
              <li>Choose the implicit that covers the weakest resistance before any currency is spent.</li>
              <li>Use <code>Greater/Perfect Orb of Transmutation</code> for life, chaos resistance, elemental resistance, strength, attributes, or recovery.</li>
              <li>Use <code>Greater/Perfect Orb of Augmentation</code>. Keep only another defensive or requirement-solving mod.</li>
              <li>Use <code>Greater Essence of Ruin</code> for chaos resistance or the exact elemental resistance essence you still need. Use <code>Greater Essence of the Body</code> only if suffixes are already good and life is missing.</li>
              <li>Apply the catalyst matching the final desired mod group. Activate <code>Omen of Catalysing Exaltation</code>, then use <code>Perfect Exalted Orb</code> for the last mod attempt.</li>
              <li>If one bad suffix blocks an otherwise strong ring, use <code>Omen of Dextral Annulment</code> + <code>Orb of Annulment</code>, then repeat the suffix slam. Restart if life or the key resistance is removed.</li>
              <li>Keep map-specific ring swaps. A slightly worse ring that caps a dangerous map is better than one perfect generic ring.</li>
            </ol>
          </article>

          <article class="card level-panel" id="craft-amulet" role="tabpanel" aria-labelledby="tab-craft-amulet" data-level-panel hidden>
            <h3>Strength / +Skill Amulet</h3>
            <p class="small">Target: strength or attributes first, then +melee/+attack skills, global defences, life, and resistance suffixes. The old fully deterministic +skill craft depended on Homogenising and should be treated as legacy-only.</p>
            <ol>
              <li>Budget craft: start with a strength or attribute amulet. Use <code>Orb of Transmutation</code> until life, resistance, strength, attributes, or natural +skills appears.</li>
              <li>Use <code>Orb of Augmentation</code>, then use <code>Greater Essence of the Infinite</code>, <code>Greater Essence of the Body</code>, or a resistance essence for the missing key stat.</li>
              <li>Near-perfect current route: buy a fractured +skill amulet or fractured high-value defensive/attribute amulet. Without a fracture or a legacy Homogenising omen, do not promise a deterministic +skill hit.</li>
              <li>If the fractured mod is a prefix, use suffix blocking: fill or target suffixes with <code>Omen of Dextral Exaltation</code> + <code>Perfect Exalted Orb</code>. If prefixes are full, plain Exalts are suffix-only.</li>
              <li>Use <code>Perfect Essence of Enhancement</code> for global defences only when you have a replaceable prefix. Use <code>Omen of Sinistral Crystallisation</code> first if you must protect suffixes.</li>
              <li>Use <code>Omen of Dextral Necromancy</code> + <code>Preserved Collarbone</code> for a desecrated suffix. Reveal with <code>Omen of Abyssal Echoes</code>; if no T1/T2 resistance or useful suffix appears, use <code>Omen of Light</code> + <code>Orb of Annulment</code> and repeat.</li>
              <li>For the final life attempt, apply life catalyst, activate <code>Omen of Catalysing Exaltation</code>, then use <code>Perfect Exalted Orb</code>. If it misses and the amulet still caps you, stop.</li>
              <li>Instill with distilled emotions only after the affixes are finished.</li>
            </ol>
          </article>

          <article class="card level-panel" id="craft-utility" role="tabpanel" aria-labelledby="tab-craft-utility" data-level-panel hidden>
            <h3>Charms, Flasks, Jewels</h3>
            <p class="small">Target: ailment coverage from charms, panic recovery from flasks, and only point-efficient jewels.</p>
            <ol>
              <li>Charms: choose the base for the ailment or hit profile first. Use <code>Orb of Transmutation</code>, keep the relevant mitigation or immunity mod, then use <code>Orb of Augmentation</code>. Do not rare-craft charms.</li>
              <li>Flasks: upgrade the base tier first. Use <code>Glassblower's Bauble</code> on a current base, then <code>Orb of Transmutation</code> and <code>Orb of Augmentation</code> until fast/instant recovery plus charge or ailment utility.</li>
              <li>Jewels: use <code>Orb of Transmutation</code> for life, armour, block, shield damage, area damage, physical damage, strength, or attributes. Use <code>Orb of Augmentation</code>; stop as magic if both mods are already strong.</li>
              <li>Only use <code>Regal Orb</code> on jewels with two useful magic mods. Jewels have a 4-mod limit, so one <code>Exalted Orb</code> finishes a 3-mod rare jewel.</li>
              <li>Do not path to a jewel socket unless the jewel beats the nearby life, armour, or shield nodes.</li>
            </ol>
          </article>
        </div>
      </div>
      <h3>Budget Priority</h3>
      <table>
        <thead>
          <tr>
            <th>Budget</th>
            <th>Spend On</th>
            <th>Skip For Now</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Zero currency</td>
            <td>Vendor or dropped shield bases, movement boots, current flasks, Transmute/Augment only.</td>
            <td>Regaling low bases, weapon DPS after Shield Wall, luxury jewels.</td>
          </tr>
          <tr>
            <td>Low currency</td>
            <td>Quality plus Essence on high-base shield, resistance rings, life/resist belt, movement boots.</td>
            <td>Unique pivots, expensive damage crafts, perfect suffix hunting.</td>
          </tr>
          <tr>
            <td>Moderate currency</td>
            <td>Rare high-armour shield, life/resist armour set, positive chaos resistance, updated charms.</td>
            <td>Overpaying for weapon damage, Smith pivot gear before the body plan is solved.</td>
          </tr>
          <tr>
            <td>Trade league search</td>
            <td>High-armour shield first, then life/resist/chaos armour, then quality-of-life upgrades.</td>
            <td>Items that add damage while lowering caps, armour, or movement speed.</td>
          </tr>
        </tbody>
      </table>

      <h3>Trade Search Terms</h3>
      <div class="grid three">
        <div class="card">
          <h3>Shield</h3>
          <p><code>Armoured Shield</code>, highest <code>Armour</code>, <code>% increased Armour</code>, <code>maximum Life</code>, <code>Block</code>, resistances.</p>
        </div>
        <div class="card">
          <h3>Weapon</h3>
          <p><code>One Hand Mace</code>, <code>+level melee skills</code>, <code>+level attack skills</code>, attack speed, strength, resistances.</p>
        </div>
        <div class="card">
          <h3>Armour And Jewelry</h3>
          <p><code>maximum Life</code>, elemental resistances, chaos resistance, strength, movement speed on boots, highest armour body for Titan, normal high-armour body for Smith.</p>
        </div>
      </div>

      <h3>Do Not Craft</h3>
      <ul>
        <li>Do not Regal low-base shields just because the first mod looks good.</li>
        <li>Do not chase weapon DPS after Shield Wall is your main damage engine.</li>
        <li>Do not wear no-movement boots in HC unless the alternative breaks resist caps for an immediate fight.</li>
        <li>Do not sacrifice elemental resistance cap or chaos mitigation for minor damage.</li>
        <li>Do not treat <code>Nightfall</code>, <code>Nebuloch</code>, or <code>Brutus' Lead Sprinkler</code> as league-start requirements.</li>
      </ul>
    </section>

    <section class="section" id="ascendancy">
      <h2>Ascendancy Choices</h2>
      <div class="grid two">
        <div class="card">
          <h3>Titan - Recommended HC Default</h3>
          <p>Titan gives the cleanest defensive profile: more life, more body armour, and eventually stronger small passives.</p>
          <ol>
            <li><strong>First points:</strong> <code>Mysterious Lineage</code> for maximum life if playing HC.</li>
            <li><strong>Second points:</strong> <code>Stone Skin</code> for body-armour scaling.</li>
            <li><strong>Third points:</strong> <code>Colossal Capacity</code>.</li>
            <li><strong>Fourth points:</strong> <code>Hulking Form</code>.</li>
          </ol>
          <p class="small">Softcore can take Colossal Capacity into Hulking Form earlier, but HC benefits more from immediate life and armour.</p>
        </div>
        <div class="card">
          <h3>Smith of Kitava - Resistance And Body Armour Variant</h3>
          <p>Smith is attractive if you want easier gearing and a normal-body-armour defensive package.</p>
          <ol>
            <li><strong>First points:</strong> <code>Coal Stoker</code> for fire resistance scaling into cold/lightning resistance.</li>
            <li><strong>Second points:</strong> <code>Smith's Masterwork</code>.</li>
            <li><strong>Masterwork priorities:</strong> <code>Kitavan Engraving</code>, <code>Molten Symbol</code>, <code>Flowing Metal</code>, <code>Internal Layer</code>, <code>Leather Bindings</code>, <code>Heatproofing</code>.</li>
            <li><strong>Later:</strong> consider <code>Forged in Flame</code> if max fire resistance scaling is available.</li>
          </ol>
          <p class="small">If using Smith's Masterwork, remember the restriction: normal body armour only.</p>
        </div>
      </div>

      <h3>Passive Tree Priorities</h3>
      <table>
        <thead>
          <tr>
            <th>Priority</th>
            <th>Take</th>
            <th>Avoid Overcommitting To</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Early</td>
            <td>Life, armour, strength, mace/stun nodes while leveling 2H.</td>
            <td>Expensive travel for late-game damage clusters.</td>
          </tr>
          <tr>
            <td>When Shield Wall starts</td>
            <td>Shield/block defence, area damage, warcry utility, physical damage, armour break.</td>
            <td>Weapon DPS nodes that do not affect shield-wall damage well.</td>
          </tr>
          <tr>
            <td>HC maps</td>
            <td>Maximum life, armour, ailment mitigation, chaos resistance, recovery.</td>
            <td>Glass damage wheels before capped resistances.</td>
          </tr>
        </tbody>
      </table>
    </section>

    <section class="section" id="mapping">
      <h2>Rotations And Mapping Rules</h2>
      <div class="grid two">
        <div class="card">
          <h3>Mapping Rotation</h3>
          <ol>
            <li>Move to edge of pack.</li>
            <li>Place <code>Shield Wall</code> through or slightly in front of enemies.</li>
            <li>Use <code>Infernal Cry</code> or shield attack to shatter.</li>
            <li>Use <code>Resonating Shield</code> while cooldowns recover.</li>
            <li><code>Leap Slam</code> forward only after the pack is controlled.</li>
          </ol>
        </div>
        <div class="card">
          <h3>Boss Rotation</h3>
          <ol>
            <li>Hold distance and learn the boss swing pattern.</li>
            <li>Use <code>Resonating Shield</code> to break armour where safe.</li>
            <li>Drop <code>Shield Wall</code> close enough that the explosion connects.</li>
            <li>Trigger with <code>Infernal Cry</code> or <code>Fortifying Cry</code>.</li>
            <li>Raise Shield or dodge while waiting on cooldowns.</li>
          </ol>
        </div>
      </div>

      <div class="callout danger">
        <strong>Hardcore map filters:</strong> skip unidentified maps, heavy extra chaos damage, reduced recovery, extreme monster speed, and any combination that makes boss telegraphs harder to react to. This build is durable, not immortal.
      </div>

      <h3>Troubleshooting</h3>
      <table>
        <thead>
          <tr>
            <th>Problem</th>
            <th>Likely Cause</th>
            <th>Fix</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Damage suddenly feels bad</td>
            <td>Shield is outdated.</td>
            <td>Upgrade shield armour before upgrading weapon.</td>
          </tr>
          <tr>
            <td>Boss damage is inconsistent</td>
            <td>Walls are placed too far away or shattered during unsafe windows.</td>
            <td>Place walls closer, use Resonating Shield first, and wait for boss recovery animations.</td>
          </tr>
          <tr>
            <td>Mana problems</td>
            <td>Too many high-multiplier supports or no mana on gear.</td>
            <td>Add mana recovery, use cost reduction supports, or reduce support multipliers temporarily.</td>
          </tr>
          <tr>
            <td>Dying to dots</td>
            <td>Armour does not solve bleed/poison/ground effects.</td>
            <td>Use correct charms, cap resists, add chaos resistance, and move out of ground effects.</td>
          </tr>
          <tr>
            <td>Clear feels clunky</td>
            <td>Cooldown rhythm is not solved.</td>
            <td>Use Infernal Cry for packs, Fortifying Cry for tough targets, and Resonating Shield as filler.</td>
          </tr>
        </tbody>
      </table>
    </section>

    <section class="section">
      <h2>Final Recommendation</h2>
      <p>
        If the goal is Hardcore league start, choose <strong>Titan Shield Wall</strong>,
        take the defensive ascendancy route first, and treat every shield upgrade
        as a major weapon upgrade. If you want smoother resist gearing and enjoy
        body-armour mechanics, choose <strong>Smith of Kitava</strong>, but keep
        the same Shield Wall campaign plan.
      </p>
      <p>
        Do not pivot into Whirling Assault, Nightfall, Nebuloch, or strength-stacking
        uniques until the character already maps comfortably. The first job of this
        build is to reach maps alive with cheap rare gear.
      </p>
    </section>

    function hydrateGearHoverCards() {
      for (const hover of document.querySelectorAll(".item-hover")) {
        const panel = hover.closest("[data-level-panel]");
        const row = hover.closest("tr");
        const card = hover.querySelector(".item-card");
        const title = hover.querySelector(".item-title");

        if (!panel || !row || !card || !title) {
          continue;
        }

        const slot = row.cells[0]?.textContent.trim();
        const stats = GEAR_HOVER_STATS[panel.id]?.[slot];

        if (!stats) {
          continue;
        }

        replaceGearHoverCard(card, title.textContent.trim(), stats);
      }
    }

    function replaceGearHoverCard(card, title, stats) {
      card.replaceChildren();
      appendGearLine(card, title, null, "item-title");
      appendGearLine(card, stats.value, "Value");
      appendGearLine(card, stats.prefixes, "Prefixes");
      appendGearLine(card, stats.suffixes, "Suffixes");
      appendGearLine(card, stats.craft, "Craft");
    }

    function appendGearLine(card, text, label, className = "item-line") {
      const line = document.createElement("span");
      line.className = className;

      if (label) {
        const labelElement = document.createElement("b");
        labelElement.textContent = `${label}: `;
        line.appendChild(labelElement);
      }

      line.append(text);
      card.appendChild(line);
    }

    function activateLevelTab(tabGroup, activeTab) {
      const tabs = Array.from(tabGroup.querySelectorAll("[data-level-tab]"));
      const panels = Array.from(tabGroup.querySelectorAll("[data-level-panel]"));
      const activePanelId = activeTab.getAttribute("aria-controls");

      for (const tab of tabs) {
        const isActive = tab === activeTab;
        tab.classList.toggle("active", isActive);
        tab.setAttribute("aria-selected", String(isActive));
      }

      for (const panel of panels) {
        panel.hidden = panel.id !== activePanelId;
      }
    }

    function moveLevelTabFocus(tabGroup, currentTab, direction) {
      const tabs = Array.from(tabGroup.querySelectorAll("[data-level-tab]"));
      const currentIndex = tabs.indexOf(currentTab);
      const nextIndex = (currentIndex + direction + tabs.length) % tabs.length;
      tabs[nextIndex].focus();
      activateLevelTab(tabGroup, tabs[nextIndex]);
    }

    for (const tabGroup of document.querySelectorAll("[data-level-tabs]")) {
      const tabs = Array.from(tabGroup.querySelectorAll("[data-level-tab]"));

      for (const tab of tabs) {
        tab.addEventListener("click", () => activateLevelTab(tabGroup, tab));
        tab.addEventListener("keydown", (event) => {
          if (event.key === "ArrowRight") {
            event.preventDefault();
            moveLevelTabFocus(tabGroup, tab, 1);
          }

          if (event.key === "ArrowLeft") {
            event.preventDefault();
            moveLevelTabFocus(tabGroup, tab, -1);
          }

          if (event.key === "Home") {
            event.preventDefault();
            tabs[0].focus();
            activateLevelTab(tabGroup, tabs[0]);
          }

          if (event.key === "End") {
            event.preventDefault();
            tabs[tabs.length - 1].focus();
            activateLevelTab(tabGroup, tabs[tabs.length - 1]);
          }
        });
      }
    }

    <section class="guide-section">
      <div class="section-heading">
        <h2>Endgame Bases And Defense</h2>
        <p>Use evasion as the default defense. Evasion/ES is fine if the gear has enough ES to justify Ghost Dance. Avoid armour bases unless a rare is absurdly better.</p>
      </div>
      <div class="table-wrap">
    <table>
      <thead><tr><th>Slot</th><th>Best base</th><th>Reason</th></tr></thead>
      <tbody>
        <tr><td>Bow</td><td>Expert Dualstring Bow or Expert Shortbow</td><td>Dualstring is best when the extra projectile is worth more than raw pDPS; Shortbow is the best cheap speed base when a rolled Dualstring is overpriced.</td></tr><tr><td>Quiver</td><td>Endgame rare quiver with projectile/bow implicit</td><td>Do not force a weak implicit. Buy the highest item-level quiver with life, attack speed, projectile damage, crit, or resists.</td></tr><tr><td>Body Armour</td><td>Expert Studded Vest, Expert Serpentscale Coat, or Expert Pathfinder Coat</td><td>Pure evasion gives the highest evade value; evasion/ES is acceptable if Ghost Dance is part of the setup.</td></tr><tr><td>Helmet</td><td>Freebooter Cap, Expert Hunter Hood, or Expert Felt Cap</td><td>Use pure evasion for Acrobatics-style play, or evasion/ES if you want Ghost Dance recovery.</td></tr><tr><td>Gloves</td><td>Polished Bracers, Barbed Bracers, or Secured Wraps</td><td>Pure evasion gloves are the default. Secured Wraps are fine if you are deliberately building ES buffer.</td></tr><tr><td>Boots</td><td>Embroidered Boots or high-item-level evasion boots</td><td>Movement speed is mandatory; the exact base matters less than 30 percent movement speed plus life/resists.</td></tr><tr><td>Belt</td><td>Heavy Belt or utility belt with life/resists</td><td>Belt is a defensive slot. Damage belts are luxury and should not be used before chaos resistance is solved.</td></tr><tr><td>Jewellery</td><td>Resist rings, attribute amulet, optional +attack skill amulet</td><td>Use jewellery to fix Dexterity, Intelligence for supports, resist caps, and mana sustain.</td></tr>

    <section class="guide-section" data-tabs>
      <div class="section-heading">
        <h2>Item Crafting Guide</h2>
        <p>Concrete order for each item slot. The sequence uses current essence and omen behavior: magic-to-rare essences first, side-specific Exalts next, and Perfect Essences only when one mod can be sacrificed.</p>
      </div>
      <div class="tab-list craft-tabs" role="tablist" aria-label="Crafting item slots">
        <button type="button" role="tab" aria-selected="true" aria-controls="craft-bow" data-target="craft-bow" tabindex="0">Bow</button><button type="button" role="tab" aria-selected="false" aria-controls="craft-quiver" data-target="craft-quiver" tabindex="-1">Quiver</button><button type="button" role="tab" aria-selected="false" aria-controls="craft-body-armour" data-target="craft-body-armour" tabindex="-1">Body Armour</button><button type="button" role="tab" aria-selected="false" aria-controls="craft-helmet" data-target="craft-helmet" tabindex="-1">Helmet</button><button type="button" role="tab" aria-selected="false" aria-controls="craft-gloves" data-target="craft-gloves" tabindex="-1">Gloves</button><button type="button" role="tab" aria-selected="false" aria-controls="craft-boots" data-target="craft-boots" tabindex="-1">Boots</button><button type="button" role="tab" aria-selected="false" aria-controls="craft-belt" data-target="craft-belt" tabindex="-1">Belt</button><button type="button" role="tab" aria-selected="false" aria-controls="craft-rings" data-target="craft-rings" tabindex="-1">Rings</button><button type="button" role="tab" aria-selected="false" aria-controls="craft-amulet" data-target="craft-amulet" tabindex="-1">Amulet</button><button type="button" role="tab" aria-selected="false" aria-controls="craft-flasks-charms-and-jewels" data-target="craft-flasks-charms-and-jewels" tabindex="-1">Flasks, Charms, and Jewels</button>
      </div>
      <div class="tab-panels">
        <article id="craft-bow" class="tab-panel" role="tabpanel" >
    <h3>Bow</h3>
    <p class="target-line">Target: item level 82+ Expert Dualstring Bow first, Expert Shortbow if the Dualstring roll is weak. Prefixes: flat cold damage, high physical damage, percent physical damage, +3 to all Attack Skills from Perfect Essence of Battle. Suffixes: attack speed, critical hit chance, critical damage bonus, accuracy if hit chance is below cap.</p>
    <ol class="craft-steps">
      <li>Start with a normal, uncorrupted item level 82+ bow base. For campaign, repeat the same method on the highest level bow you can equip.</li><li>Apply Blacksmith's Whetstones to 20% quality before investing rare currency.</li><li>Use Orb of Transmutation. Keep the item only if the first modifier is a target prefix or target suffix.</li><li>If the magic item has one target mod and one open affix, use Orb of Augmentation. If the second mod is dead, stop and move to a new base.</li><li>Use Greater Essence of Ice if the bow already has a useful suffix and you need a damage prefix. Use Greater Essence of Haste instead if it already has two strong damage prefixes and needs attack speed.</li><li>If the rare has 3 good mods and an open prefix, activate Omen of Sinistral Exaltation, then use Exalted Orb to add only a prefix.</li><li>If the rare has 3 good mods and an open suffix, activate Omen of Dextral Exaltation, then use Exalted Orb to add only a suffix.</li><li>If the rare has one low-tier bad mod, use Omen of Whittling with Chaos Orb to remove the lowest-level modifier. Only do this if the bad mod is clearly lower level than the good mods.</li><li>For a high-budget finish, use Perfect Essence of Ice or Perfect Essence of Battle only when the rare has one disposable mod. Pair with Omen of Sinistral Crystallisation if the disposable mod is a prefix, or Omen of Dextral Crystallisation if it is a suffix.</li><li>After the item has 5-6 useful mods, stop. Do not keep slamming Exalted Orbs into a finished Hardcore weapon.</li>
    </ol>
  </article><article id="craft-quiver" class="tab-panel" role="tabpanel" hidden>
    <h3>Quiver</h3>
    <p class="target-line">Target: life, projectile damage, attack speed, critical damage bonus, accuracy, resist.</p>
    <ol class="craft-steps">
      <li>Start with an item level 82+ quiver that has the implicit you want. If the implicit is weak but the rare stats are excellent, keep the stats.</li><li>Transmute and keep magic quivers with life, projectile damage, attack speed, crit, accuracy, or a strong resistance.</li><li>Augment only if the first mod is good. If the second mod is dead, vendor or sell the base and restart.</li><li>Use Greater Essence of Battle on a magic quiver when accuracy is missing and one existing mod is strong. If the magic quiver already has accuracy plus a good prefix, use Regal Orb instead.</li><li>After the quiver is rare, use Essence of Hysteria only when it has one disposable mod; the target is 43-50% increased Damage with Bow Skills. Pair with Omen of Sinistral Crystallisation or Omen of Dextral Crystallisation if the disposable mod is on a known side. Then use Omen of Dextral Exaltation for suffixes like attack speed, crit, accuracy, or resists.</li><li>Use Omen of Sinistral Exaltation if the quiver has strong suffixes and needs projectile/life-style prefixes.</li><li>If one bad suffix blocks the item, use Omen of Dextral Annulment or Dextral Erasure before adding the final suffix.</li><li>Stop at life plus three strong offensive/defensive mods for league start. Near-perfect quivers are trade targets, not day-one crafts.</li>
    </ol>
  </article><article id="craft-body-armour" class="tab-panel" role="tabpanel" hidden>
    <h3>Body Armour</h3>
    <p class="target-line">Target: pure evasion or evasion/ES body with high life, high evasion, capped resists, and optional reduced crit damage taken.</p>
    <ol class="craft-steps">
      <li>Start with Expert Studded Vest, Expert Serpentscale Coat, or Expert Pathfinder Coat. Use an evasion/ES base only if Ghost Dance is part of the plan.</li><li>Apply Armourer's Scraps to 20% quality.</li><li>Transmute. Keep only life, percent evasion/ES, flat evasion/ES, or a high resistance.</li><li>Augment if the first mod is good. If both magic mods are useful, use Greater Essence of Enhancement for high defenses or Greater Essence of the Body for life.</li><li>Use Omen of Sinistral Exaltation if prefixes are open and you need life or defense. Use Omen of Dextral Exaltation if suffixes are open and you need resists or chaos resistance.</li><li>For a premium craft, use Perfect Essence of the Body for 8-10% increased maximum life or Perfect Essence of Seeking for reduced critical damage taken. Use Crystallisation omen to force which side is removed.</li><li>Socket defensive runes after the rare is worth keeping. Do not rune a temporary leveling chest.</li>
    </ol>
  </article><article id="craft-helmet" class="tab-panel" role="tabpanel" hidden>
    <h3>Helmet</h3>
    <p class="target-line">Target: life, evasion, resists, accuracy if needed, optional cold recoup tech.</p>
    <ol class="craft-steps">
      <li>Start with Freebooter Cap, Expert Hunter Hood, or Expert Felt Cap.</li><li>Quality to 20%, then Transmute.</li><li>Keep life, percent evasion, flat evasion, accuracy, or a high resistance.</li><li>Use Greater Essence of Enhancement for defenses or Greater Essence of the Body for life if the magic item already has a useful mod.</li><li>Use Omen of Dextral Exaltation to add suffixes after prefixes are solid.</li><li>If crafting for cold-heavy content, Perfect Essence of Thawing can add cold damage recoup on helmet. Use it only with Crystallisation omen and one disposable mod.</li><li>Stop when the helmet has life, high evasion, and two useful suffixes.</li>
    </ol>
  </article><article id="craft-gloves" class="tab-panel" role="tabpanel" hidden>
    <h3>Gloves</h3>
    <p class="target-line">Target: life, evasion, attack speed, resists, accuracy.</p>
    <ol class="craft-steps">

function activateTab(group, tab) {
  const tabs = Array.from(group.querySelectorAll('[role="tab"]'));
  const panels = Array.from(group.querySelectorAll('[role="tabpanel"]'));
  const target = tab.dataset.target;

  for (const current of tabs) {
    const selected = current === tab;
    current.setAttribute('aria-selected', String(selected));
    current.tabIndex = selected ? 0 : -1;
  }

  for (const panel of panels) {
    panel.hidden = panel.id !== target;
  }
}

function moveFocus(group, tab, direction) {
  const tabs = Array.from(group.querySelectorAll('[role="tab"]'));
  const index = tabs.indexOf(tab);
  const next = tabs[(index + direction + tabs.length) % tabs.length];
  next.focus();
  activateTab(group, next);
}

for (const group of document.querySelectorAll('[data-tabs]')) {
  for (const tab of group.querySelectorAll('[role="tab"]')) {
    tab.addEventListener('click', () => activateTab(group, tab));
    tab.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowRight') {
        event.preventDefault();
        moveFocus(group, tab, 1);
      }
      if (event.key === 'ArrowLeft') {
        event.preventDefault();
        moveFocus(group, tab, -1);
      }
    });
  }

    <section class="guide-section">
      <div class="section-heading">
        <h2>Endgame Bases And Defense</h2>
        <p>Use evasion as the default defense. Evasion/ES is fine if the gear has enough ES to justify Ghost Dance. Avoid armour bases unless a rare is absurdly better.</p>
      </div>
      <div class="table-wrap">
    <table>
      <thead><tr><th>Slot</th><th>Best base</th><th>Reason</th></tr></thead>
      <tbody>
        <tr><td>Bow</td><td>Expert Dualstring Bow or Expert Shortbow</td><td>Dualstring is best when the extra projectile is worth more than raw pDPS; Shortbow is the best cheap speed base when a rolled Dualstring is overpriced.</td></tr><tr><td>Quiver</td><td>Endgame rare quiver with projectile/bow implicit</td><td>Do not force a weak implicit. Buy the highest item-level quiver with life, attack speed, projectile damage, crit, or resists.</td></tr><tr><td>Body Armour</td><td>Expert Studded Vest, Expert Serpentscale Coat, or Expert Pathfinder Coat</td><td>Pure evasion gives the highest evade value; evasion/ES is acceptable if Ghost Dance is part of the setup.</td></tr><tr><td>Helmet</td><td>Freebooter Cap, Expert Hunter Hood, or Expert Felt Cap</td><td>Use pure evasion for Acrobatics-style play, or evasion/ES if you want Ghost Dance recovery.</td></tr><tr><td>Gloves</td><td>Polished Bracers, Barbed Bracers, or Secured Wraps</td><td>Pure evasion gloves are the default. Secured Wraps are fine if you are deliberately building ES buffer.</td></tr><tr><td>Boots</td><td>Embroidered Boots or high-item-level evasion boots</td><td>Movement speed is mandatory; the exact base matters less than 30 percent movement speed plus life/resists.</td></tr><tr><td>Belt</td><td>Heavy Belt or utility belt with life/resists</td><td>Belt is a defensive slot. Damage belts are luxury and should not be used before chaos resistance is solved.</td></tr><tr><td>Jewellery</td><td>Resist rings, attribute amulet, optional +attack skill amulet</td><td>Use jewellery to fix Dexterity, Intelligence for supports, resist caps, and mana sustain.</td></tr>
      </tbody>
    </table>
  </div>
      <h3>Defense Targets</h3>
      <div class="table-wrap">
    <table>
