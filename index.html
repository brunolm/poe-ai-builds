    <section class="guide-section" data-tabs>
      <div class="section-heading">
        <h2>Item Crafting Guide</h2>
        <p>Concrete order for each item slot. The sequence uses current essence and omen behavior: magic-to-rare essences first, side-specific Exalts next, and Perfect Essences only when one mod can be sacrificed.</p>
      </div>
      <div class="tab-list craft-tabs" role="tablist" aria-label="Crafting item slots">
        <button type="button" role="tab" aria-selected="true" aria-controls="craft-bow" data-target="craft-bow" tabindex="0">Bow</button><button type="button" role="tab" aria-selected="false" aria-controls="craft-quiver" data-target="craft-quiver" tabindex="-1">Quiver</button><button type="button" role="tab" aria-selected="false" aria-controls="craft-body-armour" data-target="craft-body-armour" tabindex="-1">Body Armour</button><button type="button" role="tab" aria-selected="false" aria-controls="craft-helmet" data-target="craft-helmet" tabindex="-1">Helmet</button><button type="button" role="tab" aria-selected="false" aria-controls="craft-gloves" data-target="craft-gloves" tabindex="-1">Gloves</button><button type="button" role="tab" aria-selected="false" aria-controls="craft-boots" data-target="craft-boots" tabindex="-1">Boots</button><button type="button" role="tab" aria-selected="false" aria-controls="craft-belt" data-target="craft-belt" tabindex="-1">Belt</button><button type="button" role="tab" aria-selected="false" aria-controls="craft-rings" data-target="craft-rings" tabindex="-1">Rings</button><button type="button" role="tab" aria-selected="false" aria-controls="craft-amulet" data-target="craft-amulet" tabindex="-1">Amulet</button><button type="button" role="tab" aria-selected="false" aria-controls="craft-flasks-charms-and-jewels" data-target="craft-flasks-charms-and-jewels" tabindex="-1">Flasks, Charms, and Jewels</button>
      </div>
      <div class="tab-panels">
        <article id="craft-bow" class="tab-panel" role="tabpanel" >
    <h3>Bow</h3>
    <p class="target-line">Target: item level 82+ Expert Dualstring Bow first, Expert Shortbow if it has much higher attack speed or total DPS. Prefixes: flat lightning damage, high physical damage, percent physical damage, +3 to all Attack Skills from Perfect Essence of Battle. Suffixes: attack speed, critical hit chance, critical damage bonus, accuracy if hit chance is below cap.</p>
    <ol class="craft-steps">
      <li>Start with a normal, uncorrupted item level 82+ bow base. For campaign, repeat the same method on the highest level bow you can equip.</li><li>Apply Blacksmith's Whetstones to 20% quality before investing rare currency.</li><li>Use Orb of Transmutation. Keep the item only if the first modifier is a target prefix or target suffix.</li><li>If the magic item has one target mod and one open affix, use Orb of Augmentation. If the second mod is dead, stop and move to a new base.</li><li>Use Greater Essence of Electricity if the bow already has a useful suffix and you need a damage prefix. Use Greater Essence of Haste instead if it already has two strong damage prefixes and needs attack speed.</li><li>If the rare has 3 good mods and an open prefix, activate Omen of Sinistral Exaltation, then use Exalted Orb to add only a prefix.</li><li>If the rare has 3 good mods and an open suffix, activate Omen of Dextral Exaltation, then use Exalted Orb to add only a suffix.</li><li>If the rare has one low-tier bad mod, use Omen of Whittling with Chaos Orb to remove the lowest-level modifier. Only do this if the bad mod is clearly lower level than the good mods.</li><li>For a high-budget finish, use Perfect Essence of Electricity or Perfect Essence of Battle only when the rare has one disposable mod. Pair with Omen of Sinistral Crystallisation if the disposable mod is a prefix, or Omen of Dextral Crystallisation if it is a suffix.</li><li>After the item has 5-6 useful mods, stop. Do not keep slamming Exalted Orbs into a finished Hardcore weapon.</li>
    </ol>
  </article><article id="craft-quiver" class="tab-panel" role="tabpanel" hidden>
    <h3>Quiver</h3>
    <p class="target-line">Target: life, projectile damage, attack speed, crit, accuracy, resist.</p>
    <ol class="craft-steps">
      <li>Start with an item level 82+ quiver that has the implicit you want. If the implicit is weak but the rare stats are excellent, keep the stats.</li><li>Transmute and keep magic quivers with life, projectile damage, attack speed, crit, accuracy, or a strong resistance.</li><li>Augment only if the first mod is good. If the second mod is dead, vendor or sell the base and restart.</li><li>Use Greater Essence of Battle on a magic quiver when accuracy is missing and one existing mod is strong. If the magic quiver already has accuracy plus a good prefix, use Regal Orb instead.</li><li>After the quiver is rare, use Essence of Hysteria only when it has one disposable mod; the target is 43-50% increased Damage with Bow Skills. Pair with Omen of Sinistral Crystallisation or Omen of Dextral Crystallisation if the disposable mod is on a known side. Then use Omen of Dextral Exaltation for suffixes like attack speed, crit, accuracy, or resists.</li><li>Use Omen of Sinistral Exaltation if the quiver has strong suffixes and needs projectile/life-style prefixes.</li><li>If one bad suffix blocks the item, use Omen of Dextral Annulment or Dextral Erasure before adding the final suffix.</li><li>Stop at life plus three strong offensive/defensive mods for league start. Near-perfect quivers are trade targets, not day-one crafts.</li>
    </ol>
  </article><article id="craft-body-armour" class="tab-panel" role="tabpanel" hidden>
    <h3>Body Armour</h3>
    <p class="target-line">Target: pure evasion or evasion/ES body with high life, high evasion, capped resists, and optional reduced crit damage taken.</p>
    <ol class="craft-steps">
      <li>Start with Expert Studded Vest, Expert Serpentscale Coat, or Expert Pathfinder Coat. Use an evasion/ES base only if Ghost Dance is part of the plan.</li><li>Apply Armourer's Scraps to 20% quality.</li><li>Transmute. Keep only life, percent evasion/ES, flat evasion/ES, or a high resistance.</li><li>Augment if the first mod is good. If both magic mods are useful, use Greater Essence of Enhancement for high defenses or Greater Essence of the Body for life.</li><li>Use Omen of Sinistral Exaltation if prefixes are open and you need life or defense. Use Omen of Dextral Exaltation if suffixes are open and you need resists or chaos resistance.</li><li>For a premium craft, use Perfect Essence of the Body for 8-10% increased maximum life or Perfect Essence of Seeking for reduced critical damage taken. Use Crystallisation omen to force which side is removed.</li><li>Socket defensive runes after the rare is worth keeping. Do not rune a temporary leveling chest.</li>
    </ol>
  </article><article id="craft-helmet" class="tab-panel" role="tabpanel" hidden>
    <h3>Helmet</h3>
    <p class="target-line">Target: life, evasion, resists, accuracy if needed, optional cold recoup tech.</p>
    <ol class="craft-steps">
      <li>Start with Freebooter Cap, Expert Hunter Hood, or Expert Felt Cap.</li><li>Quality to 20%, then Transmute.</li><li>Keep life, percent evasion, flat evasion, accuracy, or a high resistance.</li><li>Use Greater Essence of Enhancement for defenses or Greater Essence of the Body for life if the magic item already has a useful mod.</li><li>Use Omen of Dextral Exaltation to add suffixes after prefixes are solid.</li><li>If crafting for cold-heavy content, Perfect Essence of Thawing can add cold damage recoup on helmet. Use it only with Crystallisation omen and one disposable mod.</li><li>Stop when the helmet has life, high evasion, and two useful suffixes.</li>
    </ol>
  </article><article id="craft-gloves" class="tab-panel" role="tabpanel" hidden>
    <h3>Gloves</h3>
    <p class="target-line">Target: life, evasion, attack speed, resists, accuracy.</p>
    <ol class="craft-steps">
      <li>Start with Polished Bracers for pure evasion or Secured Wraps for evasion/ES.</li><li>Quality to 20%, then Transmute.</li><li>Keep attack speed, life, evasion, accuracy, or a high resistance.</li><li>If the item has attack speed and life, use Omen of Sinistral Exaltation for a defensive prefix or Omen of Dextral Exaltation for another suffix.</li><li>Use Greater Essence of the Body if life is missing on a good magic base. Use Greater Essence of Enhancement if defenses are missing.</li><li>Perfect Essence of Hysteria can add critical damage bonus on gloves. Use only for offensive versions and only if Crystallisation can remove a disposable mod.</li><li>For Hardcore, stop at life, attack speed, and resists. Crit damage gloves are luxury.</li>
    </ol>
  </article><article id="craft-boots" class="tab-panel" role="tabpanel" hidden>
    <h3>Boots</h3>
    <p class="target-line">Target: 30% movement speed, life, evasion, resists, chaos resistance.</p>
    <ol class="craft-steps">
      <li>Start with Embroidered Boots or the highest item-level evasion boots you can buy.</li><li>Quality to 20%, then Transmute.</li><li>Keep movement speed, life, evasion, or a high resistance.</li><li>If movement speed is missing but the rare has life, evasion, and resists, use Essence of Hysteria to force 30% movement speed. It removes a random mod, so use it before the item is perfect.</li><li>If the rare already has 30% movement speed and life, use Omen of Dextral Exaltation to add resists or chaos resistance.</li><li>If a bad suffix blocks final resists, use Omen of Dextral Annulment or Dextral Erasure before the last Exalted Orb.</li><li>Do not run Hardcore maps with slow boots just because the evasion number is higher.</li>
    </ol>
  </article><article id="craft-belt" class="tab-panel" role="tabpanel" hidden>
    <h3>Belt</h3>
    <p class="target-line">Target: 100+ life, chaos resistance, elemental resists, flask utility.</p>
    <ol class="craft-steps">
      <li>Start with a Heavy Belt or another defensive belt base with useful implicit.</li><li>Transmute and keep life, chaos resistance, or high elemental resistance.</li><li>Use Greater Essence of the Body to force high life if the magic belt has a strong suffix.</li><li>Use Greater Essence of Ruin if chaos resistance is the missing suffix and life is already present.</li><li>Use Omen of Dextral Exaltation for additional resists or Omen of Sinistral Exaltation for life/defense prefixes.</li><li>Use Perfect Essence of Insulation, Thawing, or Grounding only if you are specifically building recoup tech and have one disposable mod.</li><li>Stop at life plus two strong resist suffixes for league start.</li>
    </ol>
  </article><article id="craft-rings" class="tab-panel" role="tabpanel" hidden>
    <h3>Rings</h3>
    <p class="target-line">Target: life, elemental resist caps, chaos resistance, accuracy, mana sustain.</p>
    <ol class="craft-steps">
      <li>Start with rings whose implicits solve your current resistance problem.</li><li>Transmute and keep life, chaos resistance, high elemental resistance, accuracy, or mana sustain.</li><li>Use Essence of the Body for life on a magic ring with a strong suffix.</li><li>Use Greater Essence of Insulation, Thawing, Grounding, or Ruin to force a missing resistance type.</li><li>Use Omen of Dextral Exaltation if prefixes are good and suffixes need resists or accuracy.</li><li>Use Catalysing Exaltation only on expensive jewellery where catalyst quality matches the modifier group you are trying to add.</li><li>Do not chase damage rings until life, resists, chaos, and mana feel stable.</li>
    </ol>
  </article><article id="craft-amulet" class="tab-panel" role="tabpanel" hidden>
    <h3>Amulet</h3>
    <p class="target-line">Target: +attack skills if affordable, otherwise Dexterity, Intelligence, life, resists, and global defences.</p>
    <ol class="craft-steps">
      <li>Start with an amulet implicit that fixes attributes or defenses.</li><li>For budget, Transmute and keep life, attributes, resists, or global defenses. Augment only after a useful first mod.</li><li>Use Greater Essence of the Infinite to force attributes if support requirements are blocking the build.</li><li>Use Greater Essence of the Body if life is missing and suffixes are already strong.</li><li>Use Perfect Essence of Enhancement on a rare amulet only when it has one disposable mod and you want global defenses.</li><li>If buying a +attack skill amulet is affordable, buy it. Self-crafting +skills is not deterministic enough for a league-start plan.</li><li>Finish with side-specific Exaltation omens only when the amulet already has at least three strong mods.</li>
    </ol>
  </article><article id="craft-flasks-charms-and-jewels" class="tab-panel" role="tabpanel" hidden>
    <h3>Flasks, Charms, and Jewels</h3>
    <p class="target-line">Target: ailment coverage, emergency recovery, evasion/projectile/damage jewels.</p>
    <ol class="craft-steps">
      <li>Use the highest-tier life flask available. For Pathfinder, flask suffixes and charge recovery matter more because Enduring Elixirs keeps recovery running.</li><li>Carry charms that cover freeze, shock, ignite, poison, or bleed based on the content you are farming.</li><li>Jewels should have life or defenses first for Hardcore, then projectile damage, attack speed, ailment magnitude, crit, or damage over time based on variant.</li><li>If a jewel has one premium mod and one dead mod, do not overspend. Replace it later with a trade jewel.</li><li>Use Omen of Amelioration while pushing levels in softcore or trade; in Hardcore it is not a substitute for defensive gearing.</li>
    </ol>
  </article>

  <script>
function activateTab(group, tab) {
  const tabs = Array.from(group.querySelectorAll('[role="tab"]'));
  const panels = Array.from(group.querySelectorAll('[role="tabpanel"]'));
  const target = tab.dataset.target;

  for (const current of tabs) {
    const selected = current === tab;
    current.setAttribute('aria-selected', String(selected));
    current.tabIndex = selected ? 0 : -1;
  }

  for (const panel of panels) {
    panel.hidden = panel.id !== target;
  }
}

function moveFocus(group, tab, direction) {
  const tabs = Array.from(group.querySelectorAll('[role="tab"]'));
  const index = tabs.indexOf(tab);
  const next = tabs[(index + direction + tabs.length) % tabs.length];
  next.focus();
  activateTab(group, next);
}

for (const group of document.querySelectorAll('[data-tabs]')) {
  for (const tab of group.querySelectorAll('[role="tab"]')) {
    tab.addEventListener('click', () => activateTab(group, tab));
    tab.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowRight') {
        event.preventDefault();
        moveFocus(group, tab, 1);
      }
      if (event.key === 'ArrowLeft') {
        event.preventDefault();
        moveFocus(group, tab, -1);
      }
    });
  }
}

    <section class="hero">
      <div>
        <p class="eyebrow">Poison, fire, tornado / PoE2 0.5 / Hardcore-aware</p>
        <h1>Bow Variant League Starter</h1>
        <p class="lede">A practical bow variant hub: Poisonburst/Gas Pathfinder for safer Hardcore DoT, Detonating Arrow Deadeye for channelled fire burst, and Tornado Shot Deadeye as the higher-invest clear pivot.</p>
        <p class="class-line">Ranger into Pathfinder for poison/Gas Arrow safety, or Ranger into Deadeye for Tornado Shot and Detonating Arrow pivots.</p>
      </div>
      <aside class="snapshot">
        <h2>Quick Rank</h2>
        <ul><li>Hardcore rating: Pathfinder poison 4/5, Detonating Arrow 3.5/5, Tornado Shot 3/5 until gear is strong.</li><li>Budget rating: Poisonburst 4/5 because it starts at Tier 1, Gas Arrow 3.5/5, Detonating Arrow 3/5, Tornado Shot 2.5/5 because it wants gear and projectile scaling.</li><li>Patch ranking: Poisonburst was nerfed but remains the safe DoT variant; Detonating Arrow gained Mirage support; Tornado Shot is a later pivot, not the safest day-one plan.</li></ul>
      </aside>
    </section>

    <section class="section-grid">
      <article class="panel">
        <h2>Patch Context</h2>
        <ul><li>Poisonburst duration and quality were nerfed in 0.5, so the guide treats poison as steady and safe, not as the top burst build.</li><li>Mirage Archer and Mirage Deadeye now work with channelled skills, which is a real gain for Detonating Arrow and Snipe-style packages.</li><li>Tornado Shot remains a scaling/pivot skill. Use it after you have projectile count, damage, and enough defenses to stand still less often.</li><li>Crafting plan assumes current 0.5 omen rules: Homogenising Exaltation/Coronation are drop-disabled, so the guide uses side-specific Exaltation, Erasure, Annulment, and Crystallisation omens instead.</li><li>Bow base choice is weighted toward live poe.ninja ladder patterns: Deadeye hit builds prefer high DPS or Dualstring-style projectile value, while Pathfinder poison builds prefer reliable attack speed and defensive rare gear.</li><li>Hardcore gearing is defensive first: capped elemental resistances, positive chaos resistance, life on every non-weapon slot, then evasion or evasion/energy shield bases.</li></ul>
      </article>
      <article class="panel">
        <h2>Core Facts</h2>
        <ul><li>Poisonburst Arrow is Tier 1, chaos/projectile/duration, and creates poison in an area on hit.</li><li>Gas Arrow is Tier 7, creates poison clouds, and can be detonated for fire explosion setups.</li><li>Detonating Arrow is Tier 9, channelled, fire, detonator, and now has Mirage Archer/Mirage Deadeye support in 0.5.</li><li>Tornado Shot is Tier 11 and copies projectiles fired into its tornado. Treat it as a map-clear engine after gear is online.</li></ul>
        <p class="source-note">Live poe.ninja filter: <a href="https://poe.ninja/poe2/builds/vaalhc?class=Pathfinder&amp;skills=Poisonburst+Arrow">https://poe.ninja/poe2/builds/vaalhc?class=Pathfinder&amp;skills=Poisonburst+Arrow</a></p>
      </article>
      <article class="panel">
        <h2>Ascendancy Order</h2>
        <ol><li>Pathfinder poison: Enduring Elixirs first, then Overwhelming Toxicity, then Sustainable Practices, then Relentless Pursuit for the 113-point Final Form tree. Path Seeker is an optional respec only if you also plan around the extra regular points it grants.</li><li>Deadeye fire or Tornado: use one 8-point package, either Gathering Winds plus Endless Munitions plus Mirage Deadeye for clear, or Gathering Winds plus Called Shots plus Bullseye plus Mirage Deadeye for bossing.</li><li>For Hardcore, do not take pure damage ascendancy choices before your movement, flask, evasion, and resist problems are solved.</li></ol>
      </article>
    </section>

        <h2>Endgame Bases And Defense</h2>

    <section class="guide-section" data-tabs>
      <div class="section-heading">
        <h2>Item Crafting Guide</h2>
        <p>Concrete order for each item slot. The sequence uses current essence and omen behavior: magic-to-rare essences first, side-specific Exalts next, and Perfect Essences only when one mod can be sacrificed.</p>
      </div>
      <div class="tab-list craft-tabs" role="tablist" aria-label="Crafting item slots">
        <button type="button" role="tab" aria-selected="true" aria-controls="craft-bow" data-target="craft-bow" tabindex="0">Bow</button><button type="button" role="tab" aria-selected="false" aria-controls="craft-quiver" data-target="craft-quiver" tabindex="-1">Quiver</button><button type="button" role="tab" aria-selected="false" aria-controls="craft-body-armour" data-target="craft-body-armour" tabindex="-1">Body Armour</button><button type="button" role="tab" aria-selected="false" aria-controls="craft-helmet" data-target="craft-helmet" tabindex="-1">Helmet</button><button type="button" role="tab" aria-selected="false" aria-controls="craft-gloves" data-target="craft-gloves" tabindex="-1">Gloves</button><button type="button" role="tab" aria-selected="false" aria-controls="craft-boots" data-target="craft-boots" tabindex="-1">Boots</button><button type="button" role="tab" aria-selected="false" aria-controls="craft-belt" data-target="craft-belt" tabindex="-1">Belt</button><button type="button" role="tab" aria-selected="false" aria-controls="craft-rings" data-target="craft-rings" tabindex="-1">Rings</button><button type="button" role="tab" aria-selected="false" aria-controls="craft-amulet" data-target="craft-amulet" tabindex="-1">Amulet</button><button type="button" role="tab" aria-selected="false" aria-controls="craft-flasks-charms-and-jewels" data-target="craft-flasks-charms-and-jewels" tabindex="-1">Flasks, Charms, and Jewels</button>
      </div>
      <div class="tab-panels">
        <article id="craft-bow" class="tab-panel" role="tabpanel" >
    <h3>Bow</h3>
    <p class="target-line">Target: Pathfinder poison: Expert Shortbow or Expert Dualstring Bow with attack speed; Deadeye fire/Tornado: Expert Dualstring Bow if projectile value beats DPS. Prefixes: flat physical damage, percent physical damage, flat fire for Detonating Arrow, chaos/poison scaling where available, +3 to all Attack Skills from Perfect Essence of Battle. Suffixes: attack speed, critical hit chance for hit variants, accuracy, attributes, resist if weapon suffixes are not needed.</p>
    <ol class="craft-steps">
      <li>Start with a normal, uncorrupted item level 82+ bow base. For campaign, repeat the same method on the highest level bow you can equip.</li><li>Apply Blacksmith's Whetstones to 20% quality before investing rare currency.</li><li>Use Orb of Transmutation. Keep the item only if the first modifier is a target prefix or target suffix.</li><li>If the magic item has one target mod and one open affix, use Orb of Augmentation. If the second mod is dead, stop and move to a new base.</li><li>Use Greater Essence of Abrasion for physical, Greater Essence of Flames for fire, or Greater Essence of Haste for attack speed if the bow already has a useful suffix and you need a damage prefix. Use Greater Essence of Haste instead if it already has two strong damage prefixes and needs attack speed.</li><li>If the rare has 3 good mods and an open prefix, activate Omen of Sinistral Exaltation, then use Exalted Orb to add only a prefix.</li><li>If the rare has 3 good mods and an open suffix, activate Omen of Dextral Exaltation, then use Exalted Orb to add only a suffix.</li><li>If the rare has one low-tier bad mod, use Omen of Whittling with Chaos Orb to remove the lowest-level modifier. Only do this if the bad mod is clearly lower level than the good mods.</li><li>For a high-budget finish, use Perfect Essence of Abrasion, Perfect Essence of Flames, or Perfect Essence of Haste depending on final variant or Perfect Essence of Battle only when the rare has one disposable mod. Pair with Omen of Sinistral Crystallisation if the disposable mod is a prefix, or Omen of Dextral Crystallisation if it is a suffix.</li><li>After the item has 5-6 useful mods, stop. Do not keep slamming Exalted Orbs into a finished Hardcore weapon.</li>
    </ol>
  </article><article id="craft-quiver" class="tab-panel" role="tabpanel" hidden>
    <h3>Quiver</h3>
    <p class="target-line">Target: life, projectile damage, attack speed, damage over time or ailment scaling where available, accuracy, resist.</p>
    <ol class="craft-steps">
      <li>Start with an item level 82+ quiver that has the implicit you want. If the implicit is weak but the rare stats are excellent, keep the stats.</li><li>Transmute and keep magic quivers with life, projectile damage, attack speed, crit, accuracy, or a strong resistance.</li><li>Augment only if the first mod is good. If the second mod is dead, vendor or sell the base and restart.</li><li>Use Greater Essence of Battle on a magic quiver when accuracy is missing and one existing mod is strong. If the magic quiver already has accuracy plus a good prefix, use Regal Orb instead.</li><li>After the quiver is rare, use Essence of Hysteria only when it has one disposable mod; the target is 43-50% increased Damage with Bow Skills. Pair with Omen of Sinistral Crystallisation or Omen of Dextral Crystallisation if the disposable mod is on a known side. Then use Omen of Dextral Exaltation for suffixes like attack speed, crit, accuracy, or resists.</li><li>Use Omen of Sinistral Exaltation if the quiver has strong suffixes and needs projectile/life-style prefixes.</li><li>If one bad suffix blocks the item, use Omen of Dextral Annulment or Dextral Erasure before adding the final suffix.</li><li>Stop at life plus three strong offensive/defensive mods for league start. Near-perfect quivers are trade targets, not day-one crafts.</li>
    </ol>
  </article><article id="craft-body-armour" class="tab-panel" role="tabpanel" hidden>
    <h3>Body Armour</h3>
    <p class="target-line">Target: pure evasion or evasion/ES body with high life, high evasion, capped resists, and optional reduced crit damage taken.</p>
    <ol class="craft-steps">
      <li>Start with Expert Studded Vest, Expert Serpentscale Coat, or Expert Pathfinder Coat. Use an evasion/ES base only if Ghost Dance is part of the plan.</li><li>Apply Armourer's Scraps to 20% quality.</li><li>Transmute. Keep only life, percent evasion/ES, flat evasion/ES, or a high resistance.</li><li>Augment if the first mod is good. If both magic mods are useful, use Greater Essence of Enhancement for high defenses or Greater Essence of the Body for life.</li><li>Use Omen of Sinistral Exaltation if prefixes are open and you need life or defense. Use Omen of Dextral Exaltation if suffixes are open and you need resists or chaos resistance.</li><li>For a premium craft, use Perfect Essence of the Body for 8-10% increased maximum life or Perfect Essence of Seeking for reduced critical damage taken. Use Crystallisation omen to force which side is removed.</li><li>Socket defensive runes after the rare is worth keeping. Do not rune a temporary leveling chest.</li>
    </ol>
  </article><article id="craft-helmet" class="tab-panel" role="tabpanel" hidden>
    <h3>Helmet</h3>
    <p class="target-line">Target: life, evasion, resists, accuracy if needed, optional cold recoup tech.</p>
    <ol class="craft-steps">
      <li>Start with Freebooter Cap, Expert Hunter Hood, or Expert Felt Cap.</li><li>Quality to 20%, then Transmute.</li><li>Keep life, percent evasion, flat evasion, accuracy, or a high resistance.</li><li>Use Greater Essence of Enhancement for defenses or Greater Essence of the Body for life if the magic item already has a useful mod.</li><li>Use Omen of Dextral Exaltation to add suffixes after prefixes are solid.</li><li>If crafting for cold-heavy content, Perfect Essence of Thawing can add cold damage recoup on helmet. Use it only with Crystallisation omen and one disposable mod.</li><li>Stop when the helmet has life, high evasion, and two useful suffixes.</li>
    </ol>
  </article><article id="craft-gloves" class="tab-panel" role="tabpanel" hidden>
    <h3>Gloves</h3>
    <p class="target-line">Target: life, evasion, attack speed, resists, accuracy.</p>
    <ol class="craft-steps">
      <li>Start with Polished Bracers for pure evasion or Secured Wraps for evasion/ES.</li><li>Quality to 20%, then Transmute.</li><li>Keep attack speed, life, evasion, accuracy, or a high resistance.</li><li>If the item has attack speed and life, use Omen of Sinistral Exaltation for a defensive prefix or Omen of Dextral Exaltation for another suffix.</li><li>Use Greater Essence of the Body if life is missing on a good magic base. Use Greater Essence of Enhancement if defenses are missing.</li><li>Perfect Essence of Hysteria can add critical damage bonus on gloves. Use only for offensive versions and only if Crystallisation can remove a disposable mod.</li><li>For Hardcore, stop at life, attack speed, and resists. Crit damage gloves are luxury.</li>
    </ol>
  </article><article id="craft-boots" class="tab-panel" role="tabpanel" hidden>
    <h3>Boots</h3>
    <p class="target-line">Target: 30% movement speed, life, evasion, resists, chaos resistance.</p>
    <ol class="craft-steps">
      <li>Start with Embroidered Boots or the highest item-level evasion boots you can buy.</li><li>Quality to 20%, then Transmute.</li><li>Keep movement speed, life, evasion, or a high resistance.</li><li>If movement speed is missing but the rare has life, evasion, and resists, use Essence of Hysteria to force 30% movement speed. It removes a random mod, so use it before the item is perfect.</li><li>If the rare already has 30% movement speed and life, use Omen of Dextral Exaltation to add resists or chaos resistance.</li><li>If a bad suffix blocks final resists, use Omen of Dextral Annulment or Dextral Erasure before the last Exalted Orb.</li><li>Do not run Hardcore maps with slow boots just because the evasion number is higher.</li>
    </ol>
  </article><article id="craft-belt" class="tab-panel" role="tabpanel" hidden>
    <h3>Belt</h3>
    <p class="target-line">Target: 100+ life, chaos resistance, elemental resists, flask utility.</p>
    <ol class="craft-steps">
      <li>Start with a Heavy Belt or another defensive belt base with useful implicit.</li><li>Transmute and keep life, chaos resistance, or high elemental resistance.</li><li>Use Greater Essence of the Body to force high life if the magic belt has a strong suffix.</li><li>Use Greater Essence of Ruin if chaos resistance is the missing suffix and life is already present.</li><li>Use Omen of Dextral Exaltation for additional resists or Omen of Sinistral Exaltation for life/defense prefixes.</li><li>Use Perfect Essence of Insulation, Thawing, or Grounding only if you are specifically building recoup tech and have one disposable mod.</li><li>Stop at life plus two strong resist suffixes for league start.</li>
    </ol>
  </article><article id="craft-rings" class="tab-panel" role="tabpanel" hidden>
    <h3>Rings</h3>
    <p class="target-line">Target: life, elemental resist caps, chaos resistance, accuracy, mana sustain.</p>
    <ol class="craft-steps">
      <li>Start with rings whose implicits solve your current resistance problem.</li><li>Transmute and keep life, chaos resistance, high elemental resistance, accuracy, or mana sustain.</li><li>Use Essence of the Body for life on a magic ring with a strong suffix.</li><li>Use Greater Essence of Insulation, Thawing, Grounding, or Ruin to force a missing resistance type.</li><li>Use Omen of Dextral Exaltation if prefixes are good and suffixes need resists or accuracy.</li><li>Use Catalysing Exaltation only on expensive jewellery where catalyst quality matches the modifier group you are trying to add.</li><li>Do not chase damage rings until life, resists, chaos, and mana feel stable.</li>
    </ol>
  </article><article id="craft-amulet" class="tab-panel" role="tabpanel" hidden>
    <h3>Amulet</h3>
    <p class="target-line">Target: Pathfinder: life, attributes, chaos/poison scaling, resists. Deadeye: +attack skills, crit, attributes, life, resists..</p>
    <ol class="craft-steps">
      <li>Start with an amulet implicit that fixes attributes or defenses.</li><li>For budget, Transmute and keep life, attributes, resists, or global defenses. Augment only after a useful first mod.</li><li>Use Greater Essence of the Infinite to force attributes if support requirements are blocking the build.</li><li>Use Greater Essence of the Body if life is missing and suffixes are already strong.</li><li>Use Perfect Essence of Enhancement on a rare amulet only when it has one disposable mod and you want global defenses.</li><li>If buying a +attack skill amulet is affordable, buy it. Self-crafting +skills is not deterministic enough for a league-start plan.</li><li>Finish with side-specific Exaltation omens only when the amulet already has at least three strong mods.</li>
    </ol>
  </article><article id="craft-flasks-charms-and-jewels" class="tab-panel" role="tabpanel" hidden>
    <h3>Flasks, Charms, and Jewels</h3>
    <p class="target-line">Target: ailment coverage, emergency recovery, evasion/projectile/damage jewels.</p>
    <ol class="craft-steps">
      <li>Use the highest-tier life flask available. For Pathfinder, flask suffixes and charge recovery matter more because Enduring Elixirs keeps recovery running.</li><li>Carry charms that cover freeze, shock, ignite, poison, or bleed based on the content you are farming.</li><li>Jewels should have life or defenses first for Hardcore, then projectile damage, attack speed, ailment magnitude, crit, or damage over time based on variant.</li><li>If a jewel has one premium mod and one dead mod, do not overspend. Replace it later with a trade jewel.</li><li>Use Omen of Amelioration while pushing levels in softcore or trade; in Hardcore it is not a substitute for defensive gearing.</li>
    </ol>
  </article>

  <script>
function activateTab(group, tab) {
  const tabs = Array.from(group.querySelectorAll('[role="tab"]'));
  const panels = Array.from(group.querySelectorAll('[role="tabpanel"]'));
  const target = tab.dataset.target;

  for (const current of tabs) {
    const selected = current === tab;
    current.setAttribute('aria-selected', String(selected));
    current.tabIndex = selected ? 0 : -1;
  }

  for (const panel of panels) {
    panel.hidden = panel.id !== target;
  }
}

function moveFocus(group, tab, direction) {
  const tabs = Array.from(group.querySelectorAll('[role="tab"]'));
  const index = tabs.indexOf(tab);
  const next = tabs[(index + direction + tabs.length) % tabs.length];
  next.focus();
  activateTab(group, next);
}

for (const group of document.querySelectorAll('[data-tabs]')) {

function activateGuide(tab) {
  const source = document.getElementById(tab.dataset.source);

  if (!source) {
    return;
  }

  for (const current of tabs) {
    const selected = current === tab;
    current.setAttribute("aria-selected", String(selected));
    current.tabIndex = selected ? 0 : -1;
  }

  frame.title = tab.dataset.title;
  frame.onload = () => injectSkillTreePlans(tab.dataset.source);
  frame.srcdoc = source.value;
  note.textContent = tab.dataset.note;
}

function moveGuideFocus(tab, direction) {
  const index = tabs.indexOf(tab);
  const next = tabs[(index + direction + tabs.length) % tabs.length];
  next.focus();
  activateGuide(next);
}

for (const tab of tabs) {
  tab.addEventListener("click", () => activateGuide(tab));
  tab.addEventListener("keydown", (event) => {
    if (event.key === "ArrowRight") {
      event.preventDefault();
      moveGuideFocus(tab, 1);
    }

    if (event.key === "ArrowLeft") {
      event.preventDefault();
      moveGuideFocus(tab, -1);
    }
  });
}

activateGuide(tabs[0]);

function injectSkillTreePlans(sourceId) {
  const guide = SKILL_TREE_GUIDES[sourceId];
  const guideDocument = frame.contentDocument;

  if (!guide || !guideDocument) {
    return;
  }

  injectSkillTreeStyles(guideDocument);
  injectSkillTreeSourceLinks(guideDocument);

  for (const [panelId, plan] of Object.entries(guide.panels)) {
    const panel = guideDocument.getElementById(panelId);

    if (!panel || panel.querySelector(".skill-tree-plan")) {
      continue;
    }

    const card = createSkillTreePlan(guideDocument, guide, panelId, plan);
    const body = panel.querySelector(".body") || panel;
    const levelHeader = body.querySelector(".level-header");
    const firstHeading = body.querySelector("h3");

    if (levelHeader) {
      levelHeader.after(card);
      continue;
    }

    if (firstHeading) {
      firstHeading.before(card);
      continue;
    }

    body.prepend(card);
  }
}

function injectSkillTreeStyles(document) {
  if (document.getElementById("skill-tree-plan-styles")) {
    return;
  }

  const style = document.createElement("style");
  style.id = "skill-tree-plan-styles";
  style.textContent = `
.skill-tree-plan {
  margin: 14px 0 18px;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-left: 4px solid var(--accent);
  border-radius: 8px;
  background: color-mix(in srgb, var(--accent) 8%, var(--panel, #20201c));
}

.skill-tree-plan h3 {
  margin-top: 0;
}

.skill-tree-plan p {
  margin: 0 0 10px;
  color: var(--muted);
}

.skill-tree-screenshot {
  margin: 0 0 14px;
}

.skill-tree-screenshot img {
  display: block;
  width: 100%;
  height: auto;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #0f1218;
}

.skill-tree-screenshot figcaption {
  margin-top: 6px;
  color: var(--muted);
  font-size: 13px;
}

.skill-tree-plan ul {
  margin-bottom: 0;
}

.skill-tree-plan strong {
  color: var(--accent);
}
`;
  document.head.append(style);
}

function injectSkillTreeSourceLinks(document) {
  const sourceList = document.querySelector(".sources");

  if (sourceList && !sourceList.querySelector("[data-skill-tree-source]")) {
    appendSkillTreeListSource(document, sourceList);
  }

  const sourceGrid = document.querySelector(".source-grid");

  if (sourceGrid && !sourceGrid.querySelector("[data-skill-tree-source]")) {
    appendSkillTreeGridSource(document, sourceGrid);
  }
}

function appendSkillTreeListSource(document, sourceList) {
  const item = document.createElement("li");
  item.dataset.skillTreeSource = "true";

  const exportLink = createSourceLink(
    document,
    "https://github.com/grindinggear/poe2-skilltree-export/tree/0.5.0",
    "GGG 0.5.0 passive tree export"
  );
  const treeLink = createSourceLink(
    document,
    "https://www.poe2wiki.net/wiki/Passive_skill_tree",
    "PoE2 Wiki passive skill tree"
  );
  const questLink = createSourceLink(
    document,
    "https://www.poe2wiki.net/wiki/Book_of_Specialisation",
    "Book of Specialisation"
  );
  const campaignLink = createSourceLink(
    document,
    "https://mobalytics.gg/poe-2/guides/0-5-campaign-checklist-stats-rewards-skillpoints-and-more",
    "Mobalytics 0.5 campaign checklist"
  );
  const ascendancyLink = createSourceLink(
    document,
    "https://www.poe2wiki.net/wiki/Ascendancy_class",
    "PoE2 Wiki ascendancy class"
  );
  const respecLink = createSourceLink(
    document,
    "https://www.poe2wiki.net/wiki/Passive_Skill_Tree#Respecialisation",
    "PoE2 Wiki respecialisation"
  );

  for (const link of [exportLink, treeLink, questLink, campaignLink, ascendancyLink, respecLink]) {
    link.dataset.skillTreeSource = "true";
  }

  item.append(exportLink, " and ", treeLink, " - node names and level/quest point totals; ", questLink, " and ", campaignLink, " - campaign quest point rewards; ", ascendancyLink, " and ", respecLink, " - separate ascendancy points and gold refunds.");
  sourceList.append(item);
}

function appendSkillTreeGridSource(document, sourceGrid) {
  const links = [
    ["GGG 0.5.0 passive tree export", "https://github.com/grindinggear/poe2-skilltree-export/tree/0.5.0"],
    ["PoE2 Wiki passive skill tree", "https://www.poe2wiki.net/wiki/Passive_skill_tree"],
    ["Book of Specialisation quest points", "https://www.poe2wiki.net/wiki/Book_of_Specialisation"],
    ["Mobalytics 0.5 campaign checklist", "https://mobalytics.gg/poe-2/guides/0-5-campaign-checklist-stats-rewards-skillpoints-and-more"],
    ["PoE2 Wiki ascendancy class", "https://www.poe2wiki.net/wiki/Ascendancy_class"],
    ["PoE2 Wiki respecialisation", "https://www.poe2wiki.net/wiki/Passive_Skill_Tree#Respecialisation"]
  ];

  for (const [label, href] of links) {
    const link = createSourceLink(document, href, label);
    link.dataset.skillTreeSource = "true";
    sourceGrid.append(link);
  }
}

function createSkillTreePlan(document, guide, panelId, plan) {
  const card = document.createElement("section");
  card.className = "skill-tree-plan";

  const heading = document.createElement("h3");
  heading.textContent = "Skill Tree Nodes";
  card.append(heading);

  card.append(createSkillTreeScreenshot(document, guide, panelId));
  appendPlanLine(document, card, "Budget", plan.budget);
  appendPlanLine(document, card, "Quest points", plan.quest);
  appendPlanLine(document, card, "Refund plan", plan.refund);
  appendPlanLine(document, card, "Ascendancy points", plan.ascendancy);

  const list = document.createElement("ul");

  for (const node of plan.nodes) {
    const item = document.createElement("li");
    item.textContent = node;
    list.append(item);
  }

  card.append(list);
  return card;
}

function createSkillTreeScreenshot(document, guide, panelId) {
  const levelSlug = panelId.replace(/^levels?-/, "");
  const levelLabel = levelSlug === "endgame" ? "Final Form" : levelSlug;
  const imagePath = `assets/skill-tree/${guide.imageSlug}-${levelSlug}.svg`;
  const figure = document.createElement("figure");
  const image = document.createElement("img");
  const caption = document.createElement("figcaption");

  figure.className = "skill-tree-screenshot";
  image.src = getHashedAssetUrl(imagePath);
  image.alt = `Selected passive tree nodes for ${levelLabel}`;
  image.loading = "eager";
  caption.textContent = "Selected route snapshot generated from the GGG 0.5.0 passive tree export and PoB2 formula-weighted route scoring; regular skill points and ascendancy points use separate pools.";

  figure.append(image, caption);
  return figure;
}

function getHashedAssetUrl(imagePath) {
  const assetUrl = new URL(imagePath, window.location.href);
  const hash = SKILL_TREE_IMAGE_HASHES[imagePath];

  if (hash) {
    assetUrl.searchParams.set("v", hash);
  }

  return assetUrl.href;
}

function appendPlanLine(document, card, label, value) {
  if (!value) {
    return;
  }

  const line = document.createElement("p");
  const strong = document.createElement("strong");
  strong.textContent = `${label}: `;
  line.append(strong, value);
  card.append(line);
}

function createSourceLink(document, href, label) {
  const link = document.createElement("a");
  link.href = href;
  link.textContent = label;
  return link;
}
  </script>
